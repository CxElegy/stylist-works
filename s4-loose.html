<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== 3D：小さな文字と、大小の写真をゆるく置いた一枚の面 =====
       参考：審美図鑑「Snog」。白地、文字は小さく、写真が主役。
       見出しで区切らず、全部の写真をひと続きに並べる。列の中で幅と左右の寄せを変えて「置いた」感じを出す。
       写真は切らない・重ねない。色は相談ボタンだけ（赤） */
    :root {
      --bg: #ffffff; --ink: #141414; --accent: #D7261E;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --pad: 16px; --gap: 20px;
      --lb-bg: #ffffff; --lb-fg: #141414; --lb-font: var(--sans);
    }
    @media (min-width: 900px) { :root { --pad: 28px; --gap: 44px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.7; text-wrap: pretty; line-break: strict; }
    a { color: inherit; text-decoration: none; }
    p, h1, h2 { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    #field:empty { min-height: 100svh; }

    .top { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: start; padding: 16px var(--pad) 28px; }
    .who { font-size: 14px; }
    .who b { display: block; font-size: 18px; letter-spacing: .02em; }
    .lead { grid-column: 1 / -1; max-width: 30em; }
    .cta { display: inline-block; background: var(--accent); color: #ffffff; font-weight: 700; padding: 8px 16px; white-space: nowrap; }
    .cta:hover, .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .top .cta { grid-row: 1; grid-column: 2; justify-self: end; }
    @media (min-width: 900px) { .top { grid-template-columns: 1fr 30em auto; } .lead { grid-column: 2; grid-row: 1; } .top .cta { grid-column: 3; } }

    .field { display: flex; gap: var(--gap); align-items: flex-start; padding: 0 var(--pad); }
    .col { flex: 1 1 0; min-width: 0; }
    .ph { margin-bottom: var(--gap); }
    .ph--r { margin-left: auto; }
    .ph__btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
    .ph__btn:hover img, .ph__btn:focus-visible img { opacity: .85; }
    .ph__btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .tag { font-size: 13px; margin: 0 0 6px; }
    .tag b { font-weight: 700; margin-right: .6em; }

    .end { padding: 40px var(--pad) 0; display: grid; gap: 28px; }
    .end h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .end p + p { margin-top: .5em; }
    .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
    .contact a:not(.cta) { border-bottom: 1px solid currentColor; }
    @media (min-width: 900px) { .end { grid-template-columns: 1fr 1fr 1fr; } }
    .foot { padding: 40px var(--pad) 20px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top" id="top">
    <h1 class="who"><b data-p="nameEn">Akari Ito</b><span data-p="nameJa">伊藤 あかり</span>｜スタイリスト</h1>
    <p class="lead" data-p="lead">ビューティーからファッション、キッズまで。雑誌・広告・カタログのスタイリングを手がけています。</p>
    <a class="cta" href="#contact">仕事を相談する</a>
  </header>

  <main class="field" id="field"></main>

  <div class="end">
    <section id="profile">
      <h2>プロフィール</h2>
      <div data-p="bio"></div>
    </section>
    <section>
      <h2>得意分野</h2>
      <p data-p="specialty"></p>
    </section>
    <section id="contact">
      <h2>お問い合わせ</h2>
      <p>お仕事のご依頼・ご相談はこちらから。</p>
      <div class="contact" style="margin-top:10px">
        <a class="cta" data-mail href="#">メールで相談する</a>
        <a data-p="email" href="#"></a>
        <a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>
  </div>
  <footer class="foot">© <span data-year></span> Akari Ito</footer>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/selection.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    (function () {
      var E = Portfolio.el, P = window.PROFILE, data = Portfolio.sets(), field = document.getElementById("field");
      // 列の中での幅（列の幅を1として）と左右の寄せ。順番にくり返す
      var W = [1, 0.66, 0.84, 0.58, 0.92, 0.72], RIGHT = [0, 1, 0, 0, 1, 1];
      var items = [], n = 0;
      data.sets.forEach(function (s) {
        s.nodes.forEach(function (d, i) {
          var k = n++ % W.length;
          d.style.width = (W[k] * 100) + "%"; if (RIGHT[k]) d.classList.add("ph--r");
          d._h = W[k] / d._r + 0.06;
          if (i === 0) { // まとまりの最初の写真の上に、小さな名札を置く
            var t = E("p", "tag"); t.appendChild(E("b", "", s.title)); t.appendChild(document.createTextNode(s.en));
            d.insertBefore(t, d.firstChild); d._h += 0.06;
          }
          items.push(d);
        });
      });
      var mq = window.matchMedia("(min-width: 900px)"), cur = 0;
      function layout() {
        var c = mq.matches ? 3 : 2; if (c === cur) return; cur = c;
        field.innerHTML = ""; var cols = [], hs = [];
        for (var k = 0; k < c; k++) { cols.push(field.appendChild(E("div", "col"))); hs.push(k * 0.18); } // 列の始まりを少しずつ下げる
        cols.forEach(function (col, k) { col.style.paddingTop = (k * 6) + "vw"; });
        items.forEach(function (d) { var m = 0; for (var k = 1; k < c; k++) if (hs[k] < hs[m] - 0.001) m = k; cols[m].appendChild(d); hs[m] += d._h; });
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout); else mq.addListener(layout);
      var mail = document.querySelector("[data-mail]");
      if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
    })();
  </script>
</body>
</html>
