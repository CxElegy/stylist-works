<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKARI ITO | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== A案：大胆 =====
       配色は「2＋1」：墨黒の地＋クリームの文字、焦橙はお問い合わせボタンだけ */
    /* 見出し用の2書体だけサイトに同梱（Google Fonts より。SIL Open Font License） */
    @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin.woff2) format("woff2"); font-display: block; }
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(assets/fonts/instrument-serif-italic-latin.woff2) format("woff2"); font-display: block; }
    :root {
      --ink: #111111; --cream: #F3EEE3; --muted: #8f8a80; --accent: #D9541E;
      --display: "Anton", "Impact", sans-serif;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --g: 20px;
      --lb-bg: #111111; --lb-fg: #F3EEE3; --lb-font: var(--sans);
    }
    @media (min-width: 768px) { :root { --g: 48px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { text-wrap: pretty; line-break: strict; margin: 0; background: var(--ink); color: var(--cream); font-family: var(--sans); font-size: 14px; line-height: 1.9; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; height: auto; }

    .bar {
      position: absolute; inset: 0 0 auto 0; z-index: 20; display: flex; justify-content: flex-end; align-items: center;
      padding: 16px var(--g); font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    }
    .bar nav { display: flex; gap: 20px; }

    /* ---- ヒーロー：巨大な名前と写真を並べる（重ねない） ---- */
    .hero { min-height: 100svh; padding: 72px var(--g) 40px; display: grid; gap: 32px; align-content: center; }
    .hero__name {
      font-family: var(--display); text-transform: uppercase; line-height: 1.02; margin: 0; letter-spacing: -.01em;
      font-size: clamp(96px, 37vw, 300px); font-weight: 400;
    }
    .hero__name span { display: block; }
    .hero__photo img { width: 100%; }
    .hero__line { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
    .hero__catch { font-family: var(--sans); font-weight: 500; font-size: clamp(20px, 2.6vw, 36px); letter-spacing: -.01em; text-transform: none; line-height: 1.15; margin: 0; }
    .hero__catch em { font-family: var(--serif); font-weight: 400; font-style: italic; }
    @media (min-width: 900px) {
      .hero__line { flex-direction: row; justify-content: space-between; align-items: end; gap: 16px; }
      .hero { grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 56px; }
      .hero__name { font-size: clamp(160px, 19vw, 320px); }
      .hero__photo img { width: auto; height: min(calc(100svh - 112px), 46vw * 1.5); }
    }

    /* ---- 取引先の名前（1回だけ、動かさない） ---- */
    .clients { background: var(--cream); color: var(--ink); padding: 20px var(--g); display: flex; flex-wrap: wrap; gap: 4px 32px; font-weight: 700; font-size: clamp(18px, 2.2vw, 28px); letter-spacing: .04em; }

    /* ---- 作品：大きな番号つき、2列を互い違いに ---- */
    .sec { padding: 120px var(--g); }
    .sec__head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--muted); padding-bottom: 12px; margin-bottom: 56px; }
    .sec__title { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 12vw, 160px); line-height: 1.02; margin: 0; text-transform: uppercase; }
    .sec__note { font-size: 13px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }

    /* 作品が並ぶ前に下の文章が先に見えて、あとで押し下げられるのを防ぐ */
    .works:empty { min-height: 100svh; }
    .works { display: flex; gap: 56px; align-items: flex-start; }
    .col { flex: 1 1 0; min-width: 0; }
    @media (min-width: 1200px) { .works { gap: 40px; } }
    .work { margin-bottom: 72px; opacity: 0; transform: translateY(40px); transition: opacity .9s, transform .9s cubic-bezier(.2,.7,.2,1); }
    .work.is-in { opacity: 1; transform: none; }
    .work__btn { display: block; width: 100%; padding: 0; border: 0; background: #1d1d1d; cursor: zoom-in; }
    .work__btn img { width: 100%; transition: opacity .4s; }
    .work__btn:hover img { opacity: .82; }
    .work__num { font-family: var(--display); font-size: 28px; line-height: 1; }
    .work__meta { display: flex; align-items: baseline; gap: 16px; margin-top: 14px; font-size: 13px; }
    .work__media { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
    .work__title { color: var(--muted); margin-left: auto; text-align: right; }

    /* ---- プロフィール ---- */
    .profile { display: grid; gap: 40px; }
    @media (min-width: 900px) { .profile { grid-template-columns: 5fr 7fr; gap: 80px; } }
    .profile__ja { font-size: 28px; font-weight: 700; letter-spacing: .12em; margin: 0; }
    .profile__en { font-family: var(--serif); font-style: italic; font-size: 32px; margin: 0; color: var(--muted); }
    .profile__bio p { margin: 0 0 1em; }
    .profile__spec { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--muted); color: var(--muted); }

    /* ---- お問い合わせ ---- */
    .contact { text-align: center; padding-bottom: 160px; }
    .contact__big { font-family: var(--display); font-size: clamp(64px, 16vw, 240px); line-height: 1.02; margin: 0; text-transform: uppercase; }
    .contact__lead { margin: 24px 0 40px; }
    .btn {
      display: inline-flex; align-items: center; gap: 12px; background: var(--accent); color: var(--ink); padding: 18px 36px;
      font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; transition: transform .3s;
    }
    .btn:hover { transform: translateY(-3px); }
    .contact__sns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; margin-top: 40px; font-size: 13px; letter-spacing: .12em; }
    .contact__sns a { border-bottom: 1px solid currentColor; }
    .foot { padding: 24px var(--g); font-size: 13px; color: var(--muted); letter-spacing: .14em; display: flex; justify-content: space-between; }

    @media (prefers-reduced-motion: reduce) {
      .work { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <nav aria-label="メニュー"><a href="#works">Works</a><a href="#profile">Profile</a><a href="#contact">Contact</a></nav>
  </header>

  <main>
    <section class="hero" id="top">
      <div>
        <h1 class="hero__name" aria-label="伊藤あかり Akari Ito"><span>Akari</span><span>Ito</span></h1>
        <div class="hero__line">
          <p class="hero__catch">Styling that <em>speaks</em>.</p>
          <span>Stylist / Tokyo</span>
        </div>
      </div>
      <div class="hero__photo"><img src="images/hero/hero.jpg" alt="伊藤あかり スタイリング作品" width="960" height="1440"></div>
    </section>

    <ul class="clients" id="clients" aria-label="主な媒体・クライアント"></ul>

    <section class="sec" id="works">
      <div class="sec__head"><h2 class="sec__title">Works</h2><span class="sec__note" id="count"></span></div>
      <div class="works" id="grid"></div>
    </section>

    <section class="sec" id="profile">
      <div class="sec__head"><h2 class="sec__title">Profile</h2></div>
      <div class="profile">
        <div>
          <p class="profile__ja" data-p="nameJa"></p>
          <p class="profile__en"><span data-p="nameEn"></span> — <span data-p="role"></span></p>
        </div>
        <div>
          <div class="profile__bio" data-p="bio"></div>
          <p class="profile__spec" data-p="specialty"></p>
        </div>
      </div>
    </section>

    <section class="sec contact" id="contact">
      <h2 class="contact__big">Let's work<br>together</h2>
      <p class="contact__lead">お仕事のご依頼・ご相談はお気軽にどうぞ。</p>
      <a class="btn" data-p-mail href="#">Contact <span aria-hidden="true">→</span></a>
      <ul class="contact__sns">
        <li><a data-p="email" href="#"></a></li>
        <li><a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a></li>
        <li><a data-p="tumblr" href="#" target="_blank" rel="noopener">Tumblr</a></li>
      </ul>
    </section>
  </main>
  <footer class="foot"><span>© <span data-year></span> Akari Ito</span><span>Stylist</span></footer>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    var E = Portfolio.el, P = window.PROFILE;
    var HERO = "images/works/personal-01.jpg"; // トップ写真と同じ作品は一覧から外す
    Portfolio.init({
      grid: "#grid",
      exclude: [HERO],
      columns: function (w) { return w >= 1200 ? 3 : w >= 768 ? 2 : 1; },
      render: function (w, i) {
        var li = E("div", "work");
        var b = E("button", "work__btn js-open"); b.type = "button";
        b.setAttribute("aria-label", Portfolio.label(w) + " を拡大表示");
        b.appendChild(E("img"));
        li.appendChild(b);
        var m = E("div", "work__meta");
        m.appendChild(E("span", "work__num", Portfolio.pad(i + 1)));
        if (w.media) m.appendChild(E("span", "work__media", w.media));
        if (w.title) m.appendChild(E("span", "work__title", w.title));
        li.appendChild(m);
        return li;
      }
    });
    document.getElementById("count").textContent = (window.WORKS.length - 1) + " selected works";
    var cl = document.getElementById("clients");
    P.clients.forEach(function (n) { cl.appendChild(E("li", "", n)); });
    var mail = document.querySelector("[data-p-mail]");
    if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
  </script>
</body>
</html>
