<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKARI ITO | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== A案：大胆 =====
       配色は「2＋1」：墨黒の地＋クリームの文字、焦橙はお問い合わせボタンだけ */
    :root {
      --ink: #111111; --cream: #F3EEE3; --muted: #8f8a80; --accent: #D9541E;
      --display: "Anton", "Impact", sans-serif;
      --sans: "Inter", "Noto Sans JP", sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --g: 20px;
      --lb-bg: #111111; --lb-fg: #F3EEE3; --lb-font: var(--sans);
    }
    @media (min-width: 768px) { :root { --g: 48px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--sans); font-size: 14px; line-height: 1.9; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; height: auto; }

    .bar {
      position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
      padding: 16px var(--g); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; mix-blend-mode: difference; color: #fff;
    }
    .bar nav { display: flex; gap: 20px; }

    /* ---- ヒーロー：巨大な名前の間に写真を差し込む ---- */
    .hero { position: relative; min-height: 100svh; padding: 72px var(--g) 40px; overflow: hidden; display: grid; align-content: center; }
    .hero__word {
      font-family: var(--display); text-transform: uppercase; line-height: .82; margin: 0; letter-spacing: -.01em;
      font-size: clamp(96px, 31vw, 420px); font-weight: 400;
    }
    .hero__word--1 { position: relative; z-index: 1; }
    .hero__word--2 { position: relative; z-index: 3; text-align: right; mix-blend-mode: difference; color: #fff; margin-top: -0.32em; }
    .hero__photo { position: relative; z-index: 2; width: min(62vw, 440px); margin: -0.9em auto 0; font-size: clamp(96px, 31vw, 420px); }
    .hero__photo img { width: 100%; aspect-ratio: 960 / 1440; object-fit: cover; }
    .hero__line {
      position: relative; z-index: 4; display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-top: 24px;
      font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    }
    .hero__catch { font-family: var(--sans); font-weight: 500; font-size: clamp(22px, 4vw, 40px); letter-spacing: -.01em; text-transform: none; line-height: 1.15; margin: 0; }
    .hero__catch em { font-family: var(--serif); font-weight: 400; font-style: italic; }

    /* ---- 媒体名が流れる帯 ---- */
    .marquee { background: var(--cream); color: var(--ink); overflow: hidden; white-space: nowrap; border-block: 1px solid var(--ink); }
    .marquee__track { display: inline-flex; animation: mq 28s linear infinite; }
    .marquee span { font-family: var(--display); font-size: clamp(36px, 7vw, 72px); text-transform: uppercase; padding: 6px 0; }
    .marquee span::after { content: "✦"; font-family: var(--sans); font-size: .4em; vertical-align: middle; margin: 0 .8em; }
    @keyframes mq { to { transform: translateX(-50%); } }

    /* ---- 作品：大きな番号つき、2列を互い違いに ---- */
    .sec { padding: 120px var(--g); }
    .sec__head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--muted); padding-bottom: 12px; margin-bottom: 56px; }
    .sec__title { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 12vw, 160px); line-height: .9; margin: 0; text-transform: uppercase; }
    .sec__note { font-size: 12px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }

    .works { columns: 1; column-gap: 56px; }
    @media (min-width: 768px) { .works { columns: 2; } .works > li:nth-child(2) { margin-top: 200px; } }
    .work { break-inside: avoid; margin-bottom: 72px; opacity: 0; transform: translateY(40px); transition: opacity .9s, transform .9s cubic-bezier(.2,.7,.2,1); }
    .work.is-in { opacity: 1; transform: none; }
    .work__btn { display: block; width: 100%; padding: 0; border: 0; background: #1d1d1d; cursor: zoom-in; overflow: hidden; position: relative; }
    .work__btn img { width: 100%; transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter .6s; filter: grayscale(.15); }
    .work__btn:hover img { transform: scale(1.04); filter: none; }
    .work__num {
      position: absolute; left: -4px; bottom: -14px; z-index: 2; font-family: var(--display); font-size: clamp(64px, 10vw, 120px); line-height: 1;
      color: var(--cream); mix-blend-mode: difference; pointer-events: none;
    }
    .work__meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; font-size: 12px; }
    .work__media { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
    .work__title { color: var(--muted); text-align: right; }

    /* ---- プロフィール ---- */
    .profile { display: grid; gap: 40px; }
    @media (min-width: 900px) { .profile { grid-template-columns: 5fr 7fr; gap: 80px; } }
    .profile__ja { font-size: 28px; font-weight: 700; letter-spacing: .12em; margin: 0; }
    .profile__en { font-family: var(--serif); font-style: italic; font-size: 32px; margin: 0; color: var(--muted); }
    .profile__bio p { margin: 0 0 1em; }
    .clients { margin-top: 40px; border-top: 1px solid var(--muted); }
    .clients li { font-family: var(--display); font-size: clamp(40px, 7vw, 88px); line-height: 1.1; text-transform: uppercase; border-bottom: 1px solid var(--muted); padding: 8px 0; }

    /* ---- お問い合わせ ---- */
    .contact { text-align: center; padding-bottom: 160px; }
    .contact__big { font-family: var(--display); font-size: clamp(64px, 16vw, 240px); line-height: .9; margin: 0; text-transform: uppercase; }
    .contact__lead { margin: 24px 0 40px; }
    .btn {
      display: inline-flex; align-items: center; gap: 12px; background: var(--accent); color: #fff; padding: 18px 36px;
      font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; transition: transform .3s;
    }
    .btn:hover { transform: translateY(-3px); }
    .contact__sns { display: flex; justify-content: center; gap: 28px; margin-top: 40px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
    .contact__sns a { border-bottom: 1px solid currentColor; }
    .foot { padding: 24px var(--g); font-size: 11px; color: var(--muted); letter-spacing: .14em; display: flex; justify-content: space-between; }

    @media (prefers-reduced-motion: reduce) {
      .marquee__track { animation: none; } .work { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a href="#top">Akari Ito</a>
    <nav aria-label="メニュー"><a href="#works">Works</a><a href="#profile">Profile</a><a href="#contact">Contact</a></nav>
  </header>

  <main>
    <section class="hero" id="top">
      <p class="hero__word hero__word--1" aria-hidden="true">Akari</p>
      <div class="hero__photo"><img src="images/hero/hero.jpg" alt="伊藤あかり スタイリング作品" width="960" height="1440"></div>
      <h1 class="hero__word hero__word--2"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">伊藤あかり Akari </span>Ito</h1>
      <div class="hero__line">
        <p class="hero__catch">Styling that <em>speaks</em>.</p>
        <span>Stylist / Tokyo</span>
      </div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" id="mq"></div>
    </div>

    <section class="sec" id="works">
      <div class="sec__head"><h2 class="sec__title">Works</h2><span class="sec__note" id="count"></span></div>
      <ul class="works" id="grid"></ul>
    </section>

    <section class="sec" id="profile">
      <div class="sec__head"><h2 class="sec__title">Profile</h2></div>
      <div class="profile">
        <div>
          <p class="profile__ja" data-p="nameJa"></p>
          <p class="profile__en"><span data-p="nameEn"></span> — <span data-p="role"></span></p>
        </div>
        <div>
          <div class="profile__bio" data-p="bio"></div>
          <ul class="clients" id="clients"></ul>
        </div>
      </div>
    </section>

    <section class="sec contact" id="contact">
      <h2 class="contact__big">Let's work<br>together</h2>
      <p class="contact__lead">お仕事のご依頼・ご相談はお気軽にどうぞ。</p>
      <a class="btn" data-p-mail href="#">Contact <span aria-hidden="true">→</span></a>
      <ul class="contact__sns">
        <li><a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a></li>
        <li><a data-p="tumblr" href="#" target="_blank" rel="noopener">Tumblr</a></li>
      </ul>
    </section>
  </main>
  <footer class="foot"><span>© <span data-year></span> Akari Ito</span><span>Stylist</span></footer>

  <script src="data/works.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    var E = Portfolio.el, P = window.PROFILE;
    var HERO = "images/works/personal-01.jpg"; // トップ写真と同じ作品は一覧から外す
    Portfolio.init({
      grid: "#grid",
      exclude: [HERO],
      render: function (w, i) {
        var li = E("li", "work");
        var b = E("button", "work__btn js-open"); b.type = "button";
        b.setAttribute("aria-label", Portfolio.label(w) + " を拡大表示");
        b.appendChild(E("img"));
        b.appendChild(E("span", "work__num", Portfolio.pad(i + 1)));
        li.appendChild(b);
        var m = E("div", "work__meta");
        if (w.media) m.appendChild(E("span", "work__media", w.media));
        if (w.title) m.appendChild(E("span", "work__title", w.title));
        li.appendChild(m);
        return li;
      }
    });
    document.getElementById("count").textContent = (window.WORKS.length - 1) + " selected works";
    // 流れる帯：取引先の名前（2回並べて途切れなくする）
    var mq = document.getElementById("mq"), names = P.clients.concat(["Personal Work"]);
    for (var r = 0; r < 4; r++) names.forEach(function (n) { mq.appendChild(E("span", "", n)); });
    var cl = document.getElementById("clients");
    P.clients.forEach(function (n) { cl.appendChild(E("li", "", n)); });
    var mail = document.querySelector("[data-p-mail]");
    if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
  </script>
</body>
</html>
