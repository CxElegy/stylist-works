<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== v2：作品を選んで、仕事の種類ごとに見せる版 =====
       配色は「2＋1」：白の地＋墨黒の文字。焦橙は Contact ボタンだけ。
       1つのまとまり＝1列（写真の高さをそろえ、幅は写真の形のまま。切らない） */
    :root {
      --bg: #ffffff; --ink: #111111; --accent: #D9541E;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --pad: 16px; --gap: 8px;
      --lb-bg: #ffffff; --lb-fg: #111111; --lb-font: var(--sans);
    }
    @media (min-width: 900px) { :root { --pad: 48px; --gap: 12px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.8; text-wrap: pretty; line-break: strict; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }
    p, h1, h2 { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 var(--pad); }
    #sets:empty { min-height: 100svh; } /* 作品が並ぶ前に、下の文章が先に見えて押し下げられるのを防ぐ */

    /* ---- 名前とメニュー ---- */
    .head { display: grid; gap: 16px; padding-top: 24px; padding-bottom: 24px; }
    .name { font-size: clamp(44px, 6.4vw, 88px); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
    .role { font-size: clamp(16px, 1.6vw, 20px); font-weight: 700; letter-spacing: .06em; margin-top: 10px; }
    .lead { font-size: 15px; line-height: 1.7; margin-top: 6px; max-width: 34em; }
    .nav__secs { display: none; } /* スマホでは Profile と Contact だけ（最初の画面をメニューで埋めない） */
    .nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; font-size: 14px; }
    .nav a:not(.btn) { border-bottom: 1px solid transparent; padding: 4px 0; }
    .nav a:not(.btn):hover, .nav a:not(.btn):focus-visible { border-color: currentColor; }
    .btn { display: inline-block; background: var(--accent); color: var(--ink); font-weight: 700; padding: 10px 20px; letter-spacing: .04em; }
    .btn:hover, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (min-width: 900px) {
      .head { grid-template-columns: 1fr auto; align-items: end; padding-top: 40px; }
      .nav { justify-content: flex-end; max-width: 560px; }
      .nav__secs { display: contents; }
    }

    /* ---- まとまり：上の線＋見出しで1組に見せる ---- */
    .set { border-top: 2px solid var(--ink); padding-top: 12px; margin-top: 72px; }
    .set--lead { margin-top: 0; }
    .set__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
    .set__no { font-size: 14px; font-variant-numeric: tabular-nums; }
    .set__title { font-size: clamp(22px, 2.4vw, 32px); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    .set__en { font-size: 14px; letter-spacing: .04em; }
    .set__note { font-size: 14px; }
    .set__count { margin-left: auto; font-size: 14px; font-variant-numeric: tabular-nums; }

    /* 1列：写真の幅は縦横比に比例（flex-grow に比を入れる）→ 高さがそろい、列の幅をぴったり埋める */
    .row { display: flex; gap: var(--gap); align-items: flex-start; }
    .row + .row { margin-top: var(--gap); }
    .ph { flex: 1 1 0; min-width: 0; }
    .ph__btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
    .ph__btn:hover img, .ph__btn:focus-visible img { opacity: .86; }
    .ph__btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .ph__cap { font-size: 13px; line-height: 1.5; margin-top: 6px; }

    /* ---- プロフィールと連絡先 ---- */
    .about { display: grid; gap: 24px; }
    .about__name { font-size: 22px; font-weight: 700; letter-spacing: .08em; }
    .about__bio p + p { margin-top: .6em; }
    .about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; }
    .about dt { font-weight: 700; }
    .about dd { margin: 0; }
    @media (min-width: 900px) { .about { grid-template-columns: 1fr 1fr 1fr; gap: 48px; } }
    .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
    .contact a:not(.btn) { border-bottom: 1px solid currentColor; }
    .foot { margin-top: 72px; border-top: 1px solid var(--ink); padding-top: 16px; padding-bottom: 24px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="wrap head" id="top">
    <div>
      <h1 class="name" data-p="nameEn">Akari Ito</h1>
      <p class="role"><span data-p="nameJa">伊藤 あかり</span>｜スタイリスト</p>
      <p class="lead" data-p="lead">美容誌・生活誌からブランドカタログまで。美的、glow、オレンジページ、BAILA、UNIQLO などのスタイリングを手がけています。</p>
    </div>
    <nav class="nav" id="nav" aria-label="メニュー"></nav>
  </header>

  <main class="wrap" id="sets"></main>

  <div class="wrap">
    <section class="set" id="profile">
      <div class="set__head"><span class="set__no" id="no-profile"></span><h2 class="set__title">プロフィール</h2><span class="set__en">Profile</span></div>
      <div class="about">
        <p class="about__name" data-p="nameJa"></p>
        <div class="about__bio" data-p="bio"></div>
        <dl>
          <dt>得意分野</dt><dd data-p="specialty"></dd>
          <dt>主な実績</dt><dd data-p="clients"></dd>
        </dl>
      </div>
    </section>

    <section class="set" id="contact">
      <div class="set__head"><span class="set__no" id="no-contact"></span><h2 class="set__title">お問い合わせ</h2><span class="set__en">Contact</span><span class="set__note">お仕事のご依頼・ご相談はこちらから</span></div>
      <div class="contact">
        <a class="btn" data-mail href="#">メールで相談する</a>
        <a data-p="email" href="#"></a>
        <a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>

    <footer class="foot">© <span data-year></span> Akari Ito</footer>
  </div>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/selection.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    (function () {
      var E = Portfolio.el, pad = Portfolio.pad, P = window.PROFILE, SEL = window.SELECTION, SZ = window.SIZES || {};
      var byImg = {}; window.WORKS.forEach(function (w) { byImg[w.image] = w; });
      var sets = [{ id: "selected", title: "代表作", en: "Selected", note: "", items: SEL.lead, lead: true }].concat(SEL.groups);
      // works.js に無い写真も、パスだけでそのまま載せる
      var flat = []; // 拡大表示で左右に送る順番（ページの並びと同じ）
      sets.forEach(function (s) { s.works = s.items.map(function (p) { return byImg[p] || { image: p, page: "", media: "", title: "", credit: "", link: "" }; }); s.start = flat.length; flat = flat.concat(s.works); });
      var open = Portfolio.lightbox(flat);

      // 1列に入れる数：パソコンは全部を1列、スマホは 2点ずつ（5点なら 2＋3）
      function chunks(n, wide) { if (wide) return [n]; var out = []; while (n > 3) { out.push(2); n -= 2; } out.push(n); return out; }

      var main = document.getElementById("sets"), nav = document.getElementById("nav"), secs = nav.appendChild(E("span", "nav__secs"));
      sets.forEach(function (s, si) {
        var sec = E("section", "set" + (s.lead ? " set--lead" : "")); sec.id = s.id;
        var head = E("div", "set__head");
        head.appendChild(E("span", "set__no", pad(si + 1)));
        head.appendChild(E("h2", "set__title", s.title));
        if (s.en) head.appendChild(E("span", "set__en", s.en));
        if (s.note) head.appendChild(E("span", "set__note", s.note));
        head.appendChild(E("span", "set__count", s.works.length + "点"));
        sec.appendChild(head);
        var mixed = {}; s.works.forEach(function (w) { mixed[w.media || ""] = 1; });
        var showCap = Object.keys(mixed).length > 1; // 媒体が1つだけのまとまりは、見出しに書いてあるので写真の下にはくり返さない
        s.nodes = s.works.map(function (w, i) {
          var d = E("div", "ph"), b = E("button", "ph__btn"), img = E("img"), sz = SZ[w.image];
          b.type = "button"; b.setAttribute("aria-label", Portfolio.label(w) + " を拡大表示");
          if (sz) { img.width = sz[0]; img.height = sz[1]; d.style.flexGrow = (sz[0] / sz[1]).toFixed(4); }
          else img.addEventListener("load", function () { d.style.flexGrow = (img.naturalWidth / img.naturalHeight).toFixed(4); }); // サイズ表に無い写真は読み込んでから合わせる
          img.src = w.image; img.alt = Portfolio.label(w); img.decoding = "async"; img.loading = si < 2 ? "eager" : "lazy";
          b.appendChild(img); d.appendChild(b);
          if (showCap && w.media) d.appendChild(E("p", "ph__cap", w.media));
          b.addEventListener("click", function () { open(s.start + i); });
          return d;
        });
        s.body = sec.appendChild(E("div", "set__body"));
        main.appendChild(sec);
        if (!s.lead) { var a = E("a", "", s.title); a.href = "#" + s.id; secs.appendChild(a); }
      });
      var ap = E("a", "", "プロフィール"); ap.href = "#profile"; nav.appendChild(ap);
      var ac = E("a", "btn", "仕事を相談する"); ac.href = "#contact"; nav.appendChild(ac);
      document.getElementById("no-profile").textContent = pad(sets.length + 1);
      document.getElementById("no-contact").textContent = pad(sets.length + 2);

      var mq = window.matchMedia("(min-width: 900px)");
      function layout() {
        sets.forEach(function (s) {
          s.body.innerHTML = ""; var k = 0;
          chunks(s.nodes.length, mq.matches).forEach(function (n) {
            var row = s.body.appendChild(E("div", "row"));
            for (var j = 0; j < n; j++) row.appendChild(s.nodes[k++]);
          });
        });
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout); else mq.addListener(layout);

      var mail = document.querySelector("[data-mail]");
      if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
    })();
  </script>
</body>
</html>
