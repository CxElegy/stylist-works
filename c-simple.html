<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito — Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== C案：最もシンプル ===== 白地・小さな文字・写真を1列に並べるだけ */
    :root {
      --bg: #ffffff; --ink: #111111; --muted: #9a9a9a;
      --sans: "Inter", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      --lb-bg: #ffffff; --lb-fg: #111111; --lb-font: var(--sans);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.9; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: .5; }
    ul { list-style: none; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; height: auto; }

    .head {
      position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94);
      display: flex; justify-content: space-between; padding: 20px 24px;
    }
    .head h1 { margin: 0; font-size: 13px; font-weight: 500; }
    .head h1 span { color: var(--muted); font-weight: 400; }
    .head nav { display: flex; gap: 20px; }

    .wrap { max-width: 600px; margin: 0 auto; padding: 48px 24px 120px; }
    .works li { margin-bottom: 96px; opacity: 0; transition: opacity 1s; }
    .works li.is-in { opacity: 1; }
    .work__btn { display: block; width: 100%; padding: 0; border: 0; background: #f4f4f4; cursor: zoom-in; }
    .work__btn img { width: 100%; }
    .work__cap { margin: 12px 0 0; display: flex; gap: 12px; }
    .work__cap span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }

    .block { margin-top: 160px; }
    .block h2 { margin: 0 0 24px; font-size: 13px; font-weight: 500; }
    .block p { margin: 0; }
    .block dl { margin: 24px 0 0; display: grid; grid-template-columns: 88px 1fr; row-gap: 6px; }
    .block dt { color: var(--muted); }
    .block dd { margin: 0; }
    .block a { border-bottom: 1px solid currentColor; }
    .foot { padding: 24px; text-align: center; color: var(--muted); font-size: 11px; }
    @media (prefers-reduced-motion: reduce) { .works li { opacity: 1; transition: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="head">
    <h1><span data-p="nameEn">Akari Ito</span> <span>— <span data-p="role">Stylist</span></span></h1>
    <nav aria-label="メニュー"><a href="#profile">Profile</a><a href="#contact">Contact</a></nav>
  </header>

  <main class="wrap">
    <ul class="works" id="grid" aria-label="作品一覧"></ul>

    <section class="block" id="profile">
      <h2>Profile</h2>
      <p data-p="nameJa"></p>
      <div data-p="bio"></div>
      <dl>
        <dt>Specialty</dt><dd data-p="specialty"></dd>
        <dt>Clients</dt><dd data-p="clients"></dd>
      </dl>
    </section>

    <section class="block" id="contact">
      <h2>Contact</h2>
      <ul>
        <li><a data-p="email" href="#"></a></li>
        <li><a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a></li>
        <li><a data-p="tumblr" href="#" target="_blank" rel="noopener">Tumblr</a></li>
      </ul>
    </section>
  </main>
  <footer class="foot">© <span data-year></span> Akari Ito</footer>

  <script src="data/works.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    var E = Portfolio.el;
    Portfolio.init({
      grid: "#grid",
      render: function (w, i, n) {
        var li = E("li");
        var b = E("button", "work__btn js-open"); b.type = "button";
        b.setAttribute("aria-label", Portfolio.label(w) + " を拡大表示");
        b.appendChild(E("img"));
        li.appendChild(b);
        var c = E("p", "work__cap");
        c.appendChild(E("span", "", Portfolio.pad(i + 1)));
        c.appendChild(E("span", "", Portfolio.label(w)));
        li.appendChild(c);
        return li;
      }
    });
  </script>
</body>
</html>
