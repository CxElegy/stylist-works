<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊藤 あかり｜スタイリスト</title>
<meta name="description" content="スタイリスト 伊藤 あかりの作品集。">
<link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Archivo R1";
  src: url(assets/fonts/archivo-var-latin.woff2) format("woff2");
  font-weight: 100 900;
  font-stretch: 62% 125%;
  font-display: block;
}
:root {
  --paper: #fff;
  --tint: #8096a6;   /* 大きな文字 */
  --ink: #586a78;    /* 小さな文字と線 */
  --nfs: max(36px, min(10vw, 15.5vh));   /* 真ん中の名前の字の大きさ */
  --big: clamp(36px, 5.5vw, 82px);
  --mid: clamp(21px, 3.4vw, 44px);
  --flip: cubic-bezier(.77, 0, .175, 1);
  --veil-ease: cubic-bezier(.5, 0, .5, 1);
  --veil-time: .49s;
  --veil-delay: 0s;
  --plus: 32px;
  --plus-top: 16px;
  --pad: 16px;
  --edge: 20px;
}
@media (max-width: 768px) {
  :root { --plus: 24px; --plus-top: 12px; --pad: 12px; --edge: 10px; --nfs: max(36px, min(17.5vw, 11vh)); }
}
* { box-sizing: border-box; }
html {
  background: var(--paper);
  color: var(--ink);
  scrollbar-width: none;
  -webkit-text-size-adjust: 100%;
  overflow-anchor: none;
}
html::-webkit-scrollbar { display: none; }
html.is-locked { overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo R1", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 800;
  font-stretch: 71%;
  text-transform: uppercase;
  letter-spacing: .02em;
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.small {
  font-family: Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 400;
  font-stretch: 100%;
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.4;
}

/* ---------- 写真の帯 ---------- */
#track {
  position: relative;
  z-index: 2;
  width: 100%;
  overflow: hidden;
  overflow: clip;
}
#block { position: absolute; left: 0; top: 0; width: 100%; height: 0; }
.ph {
  position: absolute;
  display: block;
  margin: 0; padding: 0; border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transform-origin: 50% 50%;
}
.ph img { display: block; width: 100%; height: 100%; }

/* ---------- 真ん中の名前 ---------- */
#center {
  position: fixed;
  left: 50%; top: 50%;
  z-index: 1;
  transform: translate(-50%, -50%);
  pointer-events: none;
  text-align: center;
}
#name {
  margin: 0;
  font-size: var(--nfs);
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1;
  max-width: 90vw;
  width: max-content;
  color: transparent;                                   /* 依頼主の指定：名前は輪郭だけの抜き文字にして、写真の後ろに置く */
  -webkit-text-stroke: max(1px, .016em) var(--tint);
}
#name .w { display: inline-block; }
/* 名前の下の決まった場所：ふだんは小さい一行、ジャンルを指している間はその名前。
   依頼主の指定で、小さい文字も輪郭だけの抜き文字にして、名前と同じく写真の後ろに置く */
#who {
  position: fixed;
  left: 50%; top: calc(50% + var(--nfs) / 2 + 8px);
  z-index: 1;
  margin: 0;
  transform: translateX(-50%);
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}
#who-text { display: inline-block; padding: 3px 8px; color: transparent; -webkit-text-stroke: .7px var(--ink); font-size: 15px; letter-spacing: .04em; }
#gname { display: inline-block; padding: 3px 10px 1px; color: transparent; -webkit-text-stroke: 1px var(--tint); font-size: 28px; line-height: 1.1; }
/* 「一覧を見る」は押せるボタンなので、写真より手前のまま（小さい一行のすぐ下） */
#gopen {
  position: fixed; left: 50%; top: calc(50% + var(--nfs) / 2 + 46px); z-index: 3;
  transform: translateX(-50%);
  height: 40px; margin: 0; padding: 0 10px; border: 0;
  background: #fff; color: var(--ink);
  font-size: 12px; white-space: nowrap; cursor: pointer; pointer-events: auto;
  text-decoration: underline; text-underline-offset: 3px;
}
@media (max-width: 768px) { #who-text { font-size: 14px; } #gname { font-size: 26px; } }
.flip {
  display: block;
  transition: transform .79s var(--flip), filter .79s var(--flip), opacity .79s var(--flip);
}
.is-intro .flip {
  transform: perspective(800px) translateY(50%) rotateX(-40deg);
  filter: blur(12px);
  opacity: 0;
}
.is-reveal .flip { transition-delay: .35s; }

/* ---------- ジャンルの短い列（指すと壁が切り替わる。切り替えは 1 コマ、動きなし） ---------- */
#genres {
  position: fixed; left: 0; top: 50%;
  z-index: 3;
  transform: translateY(-50%);
  display: flex; flex-direction: column;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  transition: opacity .5s linear;
}
#genres button {
  flex: none;
  display: flex; align-items: center;
  min-width: 44px; height: 44px;
  margin: 0; padding: 0 12px 0 var(--pad); border: 0;
  background: none; cursor: pointer;
  font-size: 13px; white-space: nowrap;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
#genres button span { display: block; padding: 4px 7px; background: #fff; color: var(--ink); pointer-events: none; }
#genres button.on span { background: var(--ink); color: #fff; }
#genres:not(.ready) button:not(.all) span { opacity: .45; }   /* ジャンルの写真を読み終えるまで */
#genres button:focus-visible { outline-offset: -4px; }
#genres .all { display: none; }
@media (hover: none) { #genres .all { display: flex; } }
@media (max-width: 768px) {
  #genres {
    left: 0; right: 0; top: auto; bottom: 0;
    transform: none;
    flex-direction: row;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    padding: 0 4px env(safe-area-inset-bottom, 0px);
    background: #fff;
  }
  #genres::-webkit-scrollbar { display: none; }
  #genres button { justify-content: center; padding: 0 3px; }
  #genres .all { display: flex; }
}

/* ---------- 隅のお問い合わせ ---------- */
#contact {
  position: fixed; right: 0; top: 0;
  z-index: 35;
  display: flex; align-items: center;
  height: 44px; padding: 0 var(--pad);
  margin-top: calc(var(--plus-top) - (44px - var(--plus)) / 2);
  font-size: 13px;
  transition: opacity .5s linear;
}
#contact span { display: block; padding: 4px 7px 3px; background: #fff; color: var(--ink); border-bottom: 1px solid var(--ink); }
.is-intro #genres, .is-intro #contact { opacity: 0; }
.menu-open #contact, .menu-closing #contact, .lb-open #contact, .lb-open #toggle { visibility: hidden; }

/* ---------- 加号 ---------- */
#toggle {
  position: fixed;
  left: 50%;
  top: calc(var(--plus-top) - (44px - var(--plus)) / 2);
  z-index: 50;
  width: 44px; height: 44px;
  margin: 0 0 0 -22px; padding: 0; border: 0;
  background: none;
  cursor: pointer;
  display: grid; place-items: center;
  -webkit-tap-highlight-color: transparent;
}
#plus {
  position: relative;
  display: block;
  width: var(--plus); height: var(--plus);
  transition: transform .79s var(--flip), opacity .79s var(--flip);
}
#plus::before, #plus::after {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 100%; height: 3px;
  margin-top: -1.5px;
  background: var(--ink);
}
#plus::after { transform: rotate(90deg); }
.menu-open #plus, .in-detail #plus { transform: rotate(135deg); }
.in-detail #toggle { background: rgba(255,255,255,.92); border-radius: 50%; }
.is-intro #plus { transform: rotate(-90deg) scale(.2); opacity: 0; }
.is-reveal #plus { transition-delay: .35s; }

/* ---------- ぼかし＋白の幕 ---------- */
#veil {
  position: fixed; inset: 0;
  z-index: 20;
  pointer-events: none;
  background-color: rgba(255, 255, 255, 0);
  -webkit-backdrop-filter: blur(0px);
  backdrop-filter: blur(0px);
  transition: background-color var(--veil-time) var(--veil-ease) var(--veil-delay),
              -webkit-backdrop-filter var(--veil-time) var(--veil-ease) var(--veil-delay),
              backdrop-filter var(--veil-time) var(--veil-ease) var(--veil-delay);
}
.veil-on #veil {
  background-color: rgba(255, 255, 255, 1);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  pointer-events: auto;
}
.veil-idle #veil { -webkit-backdrop-filter: none; backdrop-filter: none; transition: none; }

/* ---------- メニュー ---------- */
#menu {
  position: fixed; inset: 0;
  z-index: 40;
  display: flex; flex-direction: column;
  padding: calc(var(--plus-top) + var(--plus) + 16px) var(--pad) var(--pad);
  overflow-y: auto;
  overscroll-behavior: contain;
  visibility: hidden;
  text-align: center;
}
.menu-open #menu, .menu-closing #menu { visibility: visible; }
.m-items {
  flex: 1 0 auto;
  min-height: 34vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0; padding: 0 0 2vh;
  list-style: none;
  font-size: var(--big);
  letter-spacing: .02em;
  line-height: 1;
  color: var(--tint);
}
.m-items li { margin: 0; padding: .04em 0; }
.m-bio {
  flex: 0 0 auto;
  margin: 0 auto;
  padding: 0 0 5vh;
  max-width: 1360px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.25;
  color: var(--ink);
}
.m-bio p { margin: 0; }
.m-bio p + p { margin-top: .6em; }
.m-foot {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.2;
  color: var(--ink);
}
.m-foot a { display: inline-block; min-height: 40px; }
.m-mail { text-transform: none; }
.m-sns { display: flex; gap: .6em; }
.m-sns a { min-width: 40px; text-align: right; }
.m-copy {
  position: absolute;
  left: 50%; bottom: var(--pad);
  transform: translateX(-50%);
  margin: 0;
  white-space: nowrap;
  font-size: 11px;
}
@media (max-width: 768px) {
  .m-copy { position: static; transform: none; margin-top: 14px; }
}
.ln { display: block; }
.ln-i {
  display: block;
  transform: perspective(800px) translateY(50%) rotateX(-40deg);
  filter: blur(12px);
  opacity: 0;
  transition: none;
}
.menu-open .ln-i {
  transform: none; filter: blur(0px); opacity: 1;
  transition: transform .79s var(--flip) var(--d, 0s), filter .79s var(--flip) var(--d, 0s), opacity .79s var(--flip) var(--d, 0s);
}
.menu-closing .ln-i {
  transform: perspective(800px) translateY(-50%) rotateX(40deg);
  filter: blur(12px); opacity: 0;
  transition: transform .79s var(--flip) var(--d, 0s), filter .79s var(--flip) var(--d, 0s), opacity .79s var(--flip) var(--d, 0s);
}
#menu a { text-decoration: underline; text-decoration-color: transparent; text-underline-offset: .12em; text-decoration-thickness: 2px; text-decoration-skip-ink: none; }
#menu .m-items a { text-decoration-thickness: 4px; }
@media (max-width: 768px) { #menu .m-items a { text-decoration-thickness: 3px; } }
#menu a:hover, #menu a:focus-visible, #menu a[aria-current] { text-decoration-color: currentColor; }

/* ---------- ジャンルの一覧（見出し＋小さい画像の並び） ---------- */
#detail { position: fixed; inset: 0; z-index: 30; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #fff; opacity: 0; transition: opacity .35s linear; }
#detail.shown { opacity: 1; }
#detail .in { max-width: 1180px; margin: 0 auto; padding: 0 var(--edge) 16vh; }
#dhome { display: inline-flex; align-items: center; height: 44px; margin-top: calc(var(--plus-top) - (44px - var(--plus)) / 2); font-size: 13px; color: var(--ink); }
#detail h2 { margin: 9vh 0 6vh; text-align: center; font-weight: 400; font-size: clamp(22px, 2.4vw, 34px); line-height: 1; letter-spacing: .06em; white-space: nowrap; color: var(--ink); }
#detail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 3.4vw, 52px); align-items: start; grid-auto-flow: dense; }
#detail ol li.wide { grid-column: span 2; }                    /* 見開きの誌面は2列ぶん */
#detail ol li { opacity: 0; transform: translateY(18px); transition: opacity .5s ease-out, transform .5s ease-out; transition-delay: calc(var(--n, 0) * 35ms + 200ms); }
#detail.shown ol li { opacity: 1; transform: none; }
#detail:focus-visible { outline: none; }
#detail ol li button { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: none; cursor: zoom-in; }
#detail ol li img { display: block; width: 100%; height: auto; transition: opacity .2s linear; }   /* 写真は切らない：幅に合わせて高さは成り行き */
#detail ol li button:hover img { opacity: .8; }
#detail .more { margin: 14vh 0 0; text-align: center; }
#detail .more .k { margin: 0 0 20px; font-size: 14px; color: var(--ink); }
#detail .more ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 clamp(22px, 3.2vw, 52px); }
#detail .more li button { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; font-size: clamp(34px, 5.2vw, 72px); line-height: 1.25; white-space: nowrap; color: var(--tint); }
#detail .more li button:hover, #detail .more li button:focus-visible { color: var(--ink); }
#detail .more .c { margin: 9vh 0 0; font-size: 16px; line-height: 1.6; color: var(--ink); }
#detail .more .c a { display: inline-block; padding: 10px 0 4px; border-bottom: 1px solid var(--ink); }

/* ---------- 拡大表示 ---------- */
.x { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
.x::before, .x::after { content: ""; position: absolute; left: 50%; top: 50%; width: 141%; height: 1px; background: var(--ink); transform: translate(-50%, -50%) rotate(45deg); }
.x::after { transform: translate(-50%, -50%) rotate(-45deg); }
#lb { position: fixed; inset: 0; z-index: 45; background: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; filter: blur(12px); transition: opacity .3s linear, filter .3s linear; touch-action: pan-y pinch-zoom; -webkit-user-select: none; user-select: none; }
#lb.on { opacity: 1; filter: none; }
#lb figure { flex: none; margin: auto; transition: transform .17s ease-out, opacity .17s linear; will-change: transform; }
#lb img { display: block; max-width: calc(100vw - 2 * max(64px, 9vw) - 20px); max-height: min(86vh, calc(100vh - 96px)); width: auto; height: auto; object-fit: contain; }
#lb .x { position: fixed; right: var(--edge); top: var(--edge); width: 34px; height: 34px; z-index: 2; background: rgba(255,255,255,.92); border-radius: 50%; box-shadow: 0 0 0 8px rgba(255,255,255,.92); }
#lb .nv { position: fixed; top: 0; bottom: 0; width: max(64px, 9vw); z-index: 1; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
#lb .pv { left: 0; }
#lb .nx { right: 0; }
#lb .nv::before { content: ""; width: 16px; height: 16px; border-left: 1px solid var(--ink); border-bottom: 1px solid var(--ink); transform: translateX(4px) rotate(45deg); }
#lb .nx::before { transform: translateX(-4px) rotate(-135deg); }
#lb.one .nv { display: none; }
#lb .ct { position: fixed; left: 0; right: 0; bottom: var(--edge); margin: 0; text-align: center; pointer-events: none; font-size: 14px; color: var(--ink); }
.fine #lb img.can { cursor: zoom-in; }
#lb.zoom { overflow: auto; align-items: flex-start; }
#lb.zoom figure { padding: 56px 0 64px; }
#lb.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
#lb.zoom .nv, #lb.zoom .ct { display: none; }
#lb .nv:focus-visible { outline: none; }
#lb .nv:focus-visible::before { outline: 1px solid var(--ink); outline-offset: 12px; }
@media (max-width: 768px) {
  #detail h2 { font-size: 22px; margin: 6vh 0 28px; }
  #detail ol { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  #detail .more .c { font-size: 14px; }
  #lb img { max-width: calc(100vw - 20px); max-height: min(74vh, calc(100vh - 124px)); }
  #lb .x { width: 40px; height: 40px; }
  #lb .x::before, #lb .x::after { width: 60%; }
  #lb .nv { top: auto; bottom: 4px; height: 52px; width: 72px; }
  #lb .ct { bottom: 23px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body class="is-intro veil-on">

<button id="toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="メニューを開く"><span id="plus"></span></button>

<a id="contact" class="small" href="#"><span>お問い合わせ</span></a>

<nav id="genres" class="small" aria-label="ジャンル"></nav>

<div id="center">
  <h1 id="name"><span class="flip" id="name-text"></span></h1>
</div>
<p id="who"><span class="flip"><span id="who-text" class="small"></span><span id="gname" hidden></span></span></p>
<button id="gopen" class="small" type="button" hidden>一覧を見る</button>

<main id="track" aria-label="作品">
  <div id="block"></div>
</main>

<div id="veil"></div>

<section id="detail" aria-label="作品の一覧" hidden tabindex="-1"><div class="in"><a id="dhome" class="small" href="#"></a><h2 class="small"></h2><ol></ol><nav class="more" aria-label="ほかの作品と、お問い合わせ"></nav></div></section>

<div id="lb" role="dialog" aria-modal="true" aria-label="写真の拡大表示" hidden>
  <figure><img alt="" draggable="false"></figure>
  <button class="nv pv" type="button" aria-label="前の写真"></button>
  <button class="nv nx" type="button" aria-label="次の写真"></button>
  <button class="x" type="button" aria-label="閉じる"></button>
  <p class="ct small" aria-live="polite"></p>
</div>

<div id="menu" aria-hidden="true">
  <ul class="m-items">
    <li><a href="#" id="m-works" aria-current="page" data-split>作品</a></li>
    <li id="m-contact-li"><a href="#" id="m-contact" data-split>連絡する</a></li>
  </ul>
  <div class="m-bio" id="m-bio"></div>
  <div class="m-foot">
    <a class="m-mail" id="m-mail" href="#" data-split></a>
    <span class="m-sns" id="m-sns"></span>
  </div>
  <p class="m-copy small" id="m-copy" data-split></p>
</div>

<script src="data/works.js"></script>
<script src="data/sizes.js"></script>
<script src="data/thumbs.js"></script>
<script src="data/selection.js"></script>
<script src="data/profile.js"></script>
<script>
(function () {
  "use strict";
  var doc = document, root = doc.documentElement, body = doc.body;
  var SIZES = window.SIZES || {}, THUMBS = window.THUMBS || {}, SEL = window.SELECTION || { lead: [], groups: [] }, PROFILE = window.PROFILE || {};
  var mqCalm = window.matchMedia("(prefers-reduced-motion: reduce)");
  var mqNarrow = window.matchMedia("(max-width: 768px)");
  var mqFine = window.matchMedia("(hover: hover) and (pointer: fine)");
  var reduce = mqCalm.matches;
  function calm() { return mqCalm.matches; }
  function narrow() { return mqNarrow.matches; }
  function fine() { return mqFine.matches; }
  function syncFine() { root.classList.toggle("fine", fine()); }
  syncFine();
  if (mqFine.addEventListener) mqFine.addEventListener("change", syncFine);
  var $ = function (id) { return doc.getElementById(id); };
  function el(tag, cls, txt) { var e = doc.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function now() { return performance.now(); }

  /* ---------- 写真の一覧 ----------
     壁（ぜんぶ）：SELECTION の順（lead → 各グループ）、そのあと EXTRA をページを開くたびにランダムに並べて続ける。
     ジャンルを指している間：そのジャンルの items だけを、同じマス目にくり返し並べる。
     クラス（写っている人の大きさをそろえるための表示サイズ）：
       F = 顔のアップ / B = 胸から上 / H = 半身〜ひざ上・座り / L = 全身                              */
  var SEL_CLASS = {
    "images/works/personal-01.jpg": "L",
    "images/works/biteki-portrait-03.jpg": "F",
    "images/tumblr/08-test-shoot-02.jpg": "H",
    "images/works/personal-04.jpg": "L",
    "images/works/biteki-neo-nude-eye.jpg": "F",
    "images/works/biteki-portrait-01.jpg": "F",
    "images/works/biteki-portrait-02.jpg": "F",
    "images/works/biteki-glow-cream.jpg": "F",

  /* ---------- 拡大表示：1 枚を大きく、前へ／次へ、スワイプ ----------
