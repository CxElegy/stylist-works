<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊藤 あかり｜スタイリスト</title>
<meta name="description" content="スタイリスト 伊藤 あかり の作品集。">
<script>
/* 文字色の候補（確認用）。?tone=sand|dusk|clay|red か、前に選んだものを最初の表示から使う */
(function(){var t='sand';try{var q=/[?&]tone=([a-z]+)/.exec(location.search);t=q?q[1]:(localStorage.getItem('tone')||t)}catch(e){}document.documentElement.setAttribute('data-tone',t)})();
</script>
<style>
@font-face{font-family:"Anton";src:url("assets/fonts/anton-latin.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Instrument Sans";src:url("assets/fonts/instrument-sans-latin.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}

:root{
  /* 文字色は2つの濃さで使う：--tint＝大きな文字（AKARI ITO・BEAUTY など。写真の邪魔をしない淡さ）
                              --ink ＝小さな文字と細い線（読める濃さ。白地に対して 4.5:1 以上）          */
  --tint:#c6b598;
  --ink:#786850;
  --text:"Instrument Sans","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
  --display:"Anton","Instrument Sans","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
  --small:20px;
  --edge:20px;
  --wm:0.28665;            /* 1 / (wordmark width ÷ font-size) */
}
/* 文字色の候補。決まったら、選んだ2色を上の :root に書いて、この4行と #tones を消す */
html[data-tone="sand"]{--tint:#c6b598;--ink:#786850}   /* A 砂：砂漠の砂、乾いたベージュ */
html[data-tone="dusk"]{--tint:#a3b3bf;--ink:#586a78}   /* B 夕空：日が落ちたあとの、くすんだ青灰 */
html[data-tone="clay"]{--tint:#d6a797;--ink:#94584a}   /* C 赤土：今の赤を、乾いた土の色まで淡くしたもの */
html[data-tone="red"]{--tint:#dc2f1e;--ink:#dc2f1e}    /* 今までの赤（見比べ用） */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{color:var(--ink);font-family:var(--text);font-weight:400;font-size:var(--small);line-height:1;-webkit-text-size-adjust:100%}
a,button{color:inherit;font:inherit;text-decoration:none}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0}
img{display:block;border:0}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
[hidden]{display:none !important}

/* ---------- small text / wordmark ---------- */
.s{font-family:var(--text);font-size:var(--small);font-weight:400;line-height:1;text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.wm{font-family:var(--display);font-weight:400;line-height:1;text-transform:uppercase;white-space:nowrap;display:block;color:var(--tint)}

/* ---------- top bar ---------- */
#nav{position:fixed;left:0;top:0;width:100%;height:0;z-index:30}
#nav .l,#nav .r{position:absolute;top:var(--edge);padding:0}
#nav .l{left:var(--edge)}
#nav .r{right:var(--edge)}
#nav .mark{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center}
#nav .mark .wm{font-size:calc(21vw * var(--wm))}
#nav .who{display:block;margin-top:4px;text-transform:none}
#nav .x{position:absolute;right:var(--edge);top:var(--edge);width:34px;height:34px}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:141%;height:1px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg)}
.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
#nav .gname{text-transform:none}

/* ---------- canvas ---------- */
#stage{--p:1}
.tile{display:block}
.tile img{width:100%;height:100%}
.tile picture{display:block;width:100%;height:100%}

#title{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:12vw;line-height:1;text-transform:uppercase;white-space:nowrap;pointer-events:none;color:var(--tint)}
#ring{position:fixed;left:0;top:0;z-index:25;width:0;height:0;pointer-events:none;font-size:14px}
#ring i{position:absolute;left:0;top:0;width:7em;height:7em;border:1px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:width .05s linear,height .05s linear,opacity .05s linear;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--text);font-size:10px;line-height:1;text-transform:uppercase;white-space:nowrap}
#ring.on i{width:15.4em;height:15.4em;opacity:1}

/* ---------- loader ---------- */
#loader{position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;background:#fff;display:flex;align-items:center;justify-content:center}
#loader .wm{font-size:calc(65vw * var(--wm));animation:squeeze 1.5s linear both}
@keyframes squeeze{0%,33.3%{transform:scaleX(1)}43.3%,66.7%{transform:scaleX(.76)}76.7%,100%{transform:scaleX(1)}}

/* ---------- category view: heading + grid of thumbnails ---------- */
#detail{position:fixed;left:0;top:0;width:100%;height:100%;z-index:10;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;opacity:0;transition:opacity .35s linear}
#detail.shown{opacity:1}
#detail .in{max-width:1180px;margin:0 auto;padding:calc(6.1vw + 90px) var(--edge) 16vh}
#detail h2{margin:0 0 6vh;text-align:center;font-family:var(--text);font-weight:400;font-size:clamp(22px,2.4vw,34px);line-height:1;letter-spacing:.06em;text-transform:none;white-space:nowrap;color:var(--ink)}
#detail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3.4vw,52px);align-items:start;grid-auto-flow:dense}
#detail li.wide{grid-column:span 2}                       /* 見開きの誌面は2列ぶん */
#detail li{opacity:0;transform:translateY(18px);transition:opacity .5s ease-out,transform .5s ease-out;transition-delay:calc(var(--n,0) * 35ms + 120ms)}
#detail.shown li{opacity:1;transform:none}
#detail li button{display:block;width:100%;cursor:zoom-in}
#detail li img{width:100%;height:auto;transition:opacity .2s linear}   /* 写真は切らない：幅に合わせて高さは成り行き */
#detail li button:hover img{opacity:.8}
body.in-detail #title{z-index:5}
/* 一覧を下へ送ったら名前は消える（一覧の写真の上に文字が乗らないように）。閉じる × だけ白い丸を敷いて残す */
body.in-detail #nav .mark,body.in-detail #gname{transition:opacity .25s linear}
body.deep #nav .mark,body.deep #gname{opacity:0;pointer-events:none}
body.in-detail #nav .x{background:rgba(255,255,255,.92);border-radius:50%;box-shadow:0 0 0 8px rgba(255,255,255,.92)}

/* ---------- lightbox: one photo large ---------- */
#lb{position:fixed;left:0;top:0;width:100%;height:100%;z-index:45;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s linear;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
#lb.on{opacity:1}
#lb figure{flex:none;margin:0;transition:transform .17s ease-out,opacity .17s linear;will-change:transform}
#lb img{max-width:calc(100vw - 2 * max(64px,9vw) - 20px);max-height:86vh;width:auto;height:auto}
#lb .x{position:absolute;right:var(--edge);top:var(--edge);width:34px;height:34px;z-index:2}
#lb .nv{position:absolute;top:0;bottom:0;width:max(64px,9vw);z-index:1;display:flex;align-items:center;justify-content:center}
#lb .pv{left:0}
#lb .nx{right:0}
#lb .nv::before{content:"";width:16px;height:16px;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateX(4px) rotate(45deg)}
#lb .nx::before{transform:translateX(-4px) rotate(-135deg)}
#lb.one .nv{display:none}
#lb .ct{position:absolute;left:0;right:0;bottom:var(--edge);margin:0;text-align:center;pointer-events:none;font-size:14px}

/* ---------- 文字色の候補を切り替える小さな箱（確認用） ---------- */
#tones{position:fixed;left:var(--edge);bottom:var(--edge);z-index:48;display:flex;align-items:center;gap:14px;padding:6px 12px;background:rgba(255,255,255,.92);border:1px solid var(--ink);font-family:var(--text);font-size:13px;line-height:1;color:var(--ink);text-transform:none;white-space:nowrap}
#tones button{display:inline-flex;align-items:center;gap:6px;min-height:30px;font-size:13px;border-bottom:1px solid transparent}
#tones button[aria-pressed="true"]{border-bottom-color:var(--ink)}
#tones i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c)}
body.lb-open #tones{display:none}                          /* 拡大表示のあいだは隠す（前へ・枚数の表示に重なるため） */

/* ---------- profile ---------- */
#about{position:fixed;left:0;top:0;width:100%;height:100%;z-index:40;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
#about .x{position:fixed;right:var(--edge);top:var(--edge);width:34px;height:34px}
#about .in{max-width:34em;margin:0 auto;padding:22vh var(--edge) 12vh}
#about h2{margin:0 0 .5em;font-family:var(--display);font-weight:400;font-size:min(12vw,120px);line-height:1;text-transform:uppercase;color:var(--tint)}
#about p{margin:0 0 1.4em;font-size:var(--small);line-height:1.8;text-transform:none;white-space:normal}
#about p.k{margin-bottom:.4em;line-height:1}
#about a{border-bottom:1px solid var(--ink)}

/* ---------- foot (mobile only) ---------- */
#foot{display:none}

/* ================= wide: fixed canvas ================= */
@media (min-width:768px){
  html,body{height:100%;overflow:hidden}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;will-change:transform}
  .tile{position:absolute;left:50%;top:50%;height:calc(var(--h) * 1vh);aspect-ratio:var(--ar);
    transform:translate(calc(-50% + var(--x) * var(--p) * 1vw),calc(-50% + var(--y) * var(--p) * 1vh));
    z-index:var(--z);transition:z-index 0s linear .25s}
  .tile img{transform:scale(var(--s,1));transition:transform .25s ease-out;will-change:transform}
  .tile.hot{z-index:9;transition:z-index 0s}
  .tile.hot img{--s:1.4;transition:transform .2s ease-out}
  .tile.grow img{transition:transform .1s ease-out}
  .tile.gone{visibility:hidden}
  .fine .tile{cursor:none}
  body.busy .tile{pointer-events:none}
}

/* ================= narrow: plain list ================= */
@media (max-width:767px){
  :root{--small:14px;--edge:10px}
  #loader,#ring{display:none !important}
  #nav{position:fixed}
  #nav .mark{position:absolute;top:18px}
  #nav .mark .wm{font-size:calc(85vw * var(--wm))}
  #nav .who{margin-top:6px}
  #nav .l,#nav .r{top:calc(18px + 85vw * var(--wm) + 26px);padding:15px 10px}
  #nav .l{left:auto;right:50%}
  #nav .r{right:auto;left:50%}
  #nav .x{top:calc(18px + 85vw * var(--wm) + 22px);right:auto;left:50%;margin-left:10px;width:40px;height:40px}
  #nav .x::before,#nav .x::after{width:60%}
  #stage{padding:24.6vh 10px 0}
  .tile{height:80vh;margin:0 0 calc(20vh + 10px);overflow:hidden}
  .tile img{object-fit:cover;object-position:var(--pos,50% 50%)}
  #title{display:none}
  #foot{display:block;padding:0 15px 24px;font-size:24px;line-height:1;text-align:left;transform:translateY(40px);opacity:0;transition:transform .7s ease-out,opacity .7s ease-out}
  #foot.in{transform:none;opacity:1}
  #foot p{margin:0;padding:0 0 6px;font-size:24px;line-height:1;white-space:nowrap}
  #foot a,#foot button{display:inline-block;font-size:24px;line-height:1;text-align:left}
  #detail .in{padding:calc(18px + 85vw * var(--wm) + 100px) 10px 16vh}
  #detail h2{font-size:22px;margin-bottom:28px}
  #detail ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #lb img{max-width:calc(100vw - 20px);max-height:74vh}
  #lb .x{width:40px;height:40px}
  #lb .x::before,#lb .x::after{width:60%}
  #lb .nv{top:auto;bottom:4px;height:52px;width:72px}
  #lb .ct{bottom:23px}
  #tones{left:8px;bottom:8px;gap:10px;padding:4px 8px;font-size:12px}
  #tones button{font-size:12px}
  #nav .x{transition:top .25s ease-out,left .25s ease-out,margin-left .25s ease-out}
  body.deep #nav .x{top:14px;left:calc(100% - 54px);margin-left:0}     /* 送ったあとは右上の角へ */
  #about .in{padding-top:24.6vh}
  body.locked{overflow:hidden}
}
@media (max-width:767px) and (min-height:1px){
  @supports (height:1svh){
    .tile{height:80svh;margin-bottom:calc(20svh + 10px)}
  }
}
@media (prefers-reduced-motion:reduce){
  #loader{display:none !important}
  .tile img,.tile.hot img,.tile.grow img{transition:none !important}
  #foot{transform:none;opacity:1;transition:none}
  #detail,#detail li,#detail li img,#lb,#lb figure,#nav .mark,#gname,#nav .x{transition:none !important}
}
</style>
</head>
<body>

<div id="loader" aria-hidden="true"><span class="wm" data-name></span></div>

<header id="nav">
  <button class="l s" id="openAbout" type="button">プロフィール</button>
  <span class="l s gname" id="gname" hidden></span>
  <a class="mark" id="home" href="#top"><span class="wm" data-name></span><span class="who s" id="who"></span></a>
  <a class="r s" id="mail" href="#">お問い合わせ</a>
  <button class="x" id="closeDetail" type="button" aria-label="閉じる" hidden></button>
</header>

<main id="stage"></main>

<footer id="foot"></footer>

<p id="title" aria-hidden="true" hidden></p>
<div id="ring" aria-hidden="true"><i>View</i></div>

<section id="detail" aria-label="作品の一覧" hidden tabindex="-1"><div class="in"><h2></h2><ol></ol></div></section>

<div id="lb" role="dialog" aria-modal="true" aria-label="写真の拡大表示" hidden>
  <figure><img alt="" draggable="false"></figure>
  <button class="nv pv" type="button" aria-label="前の写真"></button>
  <button class="nv nx" type="button" aria-label="次の写真"></button>
  <button class="x" type="button" aria-label="閉じて一覧に戻る"></button>
  <p class="ct s" aria-live="polite"></p>
</div>

<div id="tones" role="group" aria-label="文字色の候補（確認用）">
  <span>文字色</span>
  <button type="button" data-tone="sand" style="--c:#c6b598"><i></i>A 砂</button>
  <button type="button" data-tone="dusk" style="--c:#a3b3bf"><i></i>B 夕空</button>
  <button type="button" data-tone="clay" style="--c:#d6a797"><i></i>C 赤土</button>
  <button type="button" data-tone="red" style="--c:#dc2f1e"><i></i>今の赤</button>
</div>

<section id="about" aria-label="プロフィール" hidden tabindex="-1">
  <button class="x" id="closeAbout" type="button" aria-label="閉じる"></button>
  <div class="in"></div>
</section>

<script src="data/works.js"></script>
<script src="data/sizes.js"></script>
<script src="data/selection.js"></script>
<script src="data/profile.js"></script>
<script>
(function(){
  'use strict';
  var SEL = window.SELECTION || {lead:[],groups:[]};
  var SIZES = window.SIZES || {};
  var PRO = window.PROFILE || {};
  var doc = document, body = doc.body, root = doc.documentElement;
  function $(id){ return doc.getElementById(id); }
  function el(tag, cls, txt){ var e = doc.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  /* ---------- groups ---------- */
  var GROUPS = {};
  GROUPS.selected = { id:'selected', title:'セレクト', en:'Selected', items:(SEL.lead || []).slice() };
  (SEL.groups || []).forEach(function(g){ GROUPS[g.id] = g; });

  /* ---------- the eight places: centre offset x (%VW), y (%VH), height (%VH), layer ----------
     hand-set; photo shown whole on wide screens. `m` = photo used in the narrow list (optional),
     `pos` = which part stays visible when the narrow list crops it.                                */
  var PLACES = [
    { g:'beauty',    src:'images/works/biteki-spring-cosme-2026.jpg', x:-37, y:  3, h:40, z:5, m:'images/works/biteki-portrait-01.jpg', pos:'22% 50%' },
    { g:'kids',      src:'images/tumblr/06-kids-09.jpg',              x: 40, y:-27, h:22, z:3, pos:'42% 50%' },
    { g:'selected',  src:'images/tumblr/08-test-shoot-02.jpg',        x: -2, y:-13, h:46, z:4, pos:'50% 50%' },
    { g:'portrait',  src:'images/tumblr/03-mi-mollet-04.jpg',         x: 34, y:  8, h:34, z:2, pos:'40% 50%' },
    { g:'casual',    src:'images/tumblr/01-uniqlo-04.jpg',            x:-32, y: 44, h:42, z:2, pos:'50% 50%' },
    { g:'elegance',  src:'images/tumblr/03-mi-mollet-01.jpg',         x: 50, y: 42, h:34, z:2, pos:'42% 50%' },
    { g:'elegance',  src:'images/tumblr/04-elura-06.jpg',             x:-27, y:-17, h:28, z:2, pos:'55% 50%' },
    { g:'editorial', src:'images/tumblr/08-test-shoot-07.jpg',        x:  1, y: 40, h:48, z:1, pos:'45% 50%' }
  ];

  function ratioN(src){ var s = SIZES[src]; return s ? (s[0] / s[1]).toFixed(5) : '0.75'; }
  function ratio(src){ var s = SIZES[src]; return s ? s[0] + ' / ' + s[1] : '3 / 4'; }

  /* ---------- environment ---------- */
  var mqNarrow = window.matchMedia('(max-width:767px)');
  var mqFine = window.matchMedia('(hover:hover) and (pointer:fine)');
  var mqCalm = window.matchMedia('(prefers-reduced-motion:reduce)');
  function narrow(){ return mqNarrow.matches; }
  function calm(){ return mqCalm.matches; }
  function fine(){ return mqFine.matches; }
  function syncFine(){ root.classList.toggle('fine', fine()); }
  syncFine();
  if (mqFine.addEventListener) mqFine.addEventListener('change', syncFine);

  var raf = window.requestAnimationFrame.bind(window);
  function now(){ return performance.now(); }
  function run(ms, ease, fn, done){
    var t0 = now();
    (function step(){
      var k = Math.min(1, (now() - t0) / ms);
      fn(ease(k));
      if (k < 1) raf(step); else if (done) done();
    })();
  }
  function outQuart(k){ var u = 1 - k; return 1 - u * u * u * u; }
  function inOut(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function outCubic(k){ var u = 1 - k; return 1 - u * u * u; }

  /* ---------- text ---------- */
  var nameEn = PRO.nameEn || 'Akari Ito';
  Array.prototype.forEach.call(doc.querySelectorAll('[data-name]'), function(n){ n.textContent = nameEn; });
  $('who').textContent = (PRO.nameJa || '伊藤 あかり') + '｜スタイリスト';
  $('home').setAttribute('aria-label', (PRO.nameJa || '伊藤 あかり') + '（スタイリスト）トップへ');
  if (PRO.email) $('mail').href = 'mailto:' + PRO.email; else $('mail').hidden = true;

  /* ---------- build tiles ---------- */
  var stage = $('stage'), titleEl = $('title'), ring = $('ring'), nav = $('nav');
  var tiles = [];
  PLACES.forEach(function(pl, i){
    var g = GROUPS[pl.g]; if (!g) return;
    var a = el('a', 'tile');
    a.href = '#' + g.id;
    a.setAttribute('aria-label', g.title + 'の作品を見る');
    a.style.setProperty('--x', pl.x); a.style.setProperty('--y', pl.y); a.style.setProperty('--h', pl.h);
    a.style.setProperty('--z', pl.z); a.style.setProperty('--ar', ratio(pl.src)); a.style.setProperty('--pos', pl.pos || '50% 50%');
    var pic = el('picture');
    if (pl.m){ var so = el('source'); so.media = '(max-width:767px)'; so.srcset = pl.m; pic.appendChild(so); }
    var im = el('img'); im.alt = g.title; im.decoding = 'async'; im.draggable = false; im.src = pl.src;
    var sz = SIZES[pl.src]; if (sz){ im.width = sz[0]; im.height = sz[1]; }
    pic.appendChild(im); a.appendChild(pic); stage.appendChild(a);
    var t = { a:a, img:im, pl:pl, g:g, i:i };
    tiles.push(t);
    a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) heat(t, 'key'); });
    a.addEventListener('blur', function(){ if (hot === t && hotBy === 'key') cool(); });
    a.addEventListener('click', function(e){ e.preventDefault(); pick(t); });
  });

  /* ---------- state ---------- */
  var busy = true, hot = null, hotBy = '', locked = false, view = 'home', lastTile = null;
  var mouse = { x:0, y:0, seen:false }, pan = { x:0, y:0 }, panOn = false, panLast = 0;
  function setBusy(v){ busy = v; body.classList.toggle('busy', v); }
  function setP(p){ stage.style.setProperty('--p', p.toFixed(5)); }
  function setNav(n){ nav.style.transform = n >= 1 ? '' : 'translateY(' + ((n - 1) * 30).toFixed(3) + 'vh)'; }
  function setPan(){ stage.style.transform = (pan.x || pan.y) ? 'translate3d(' + pan.x.toFixed(2) + 'px,' + pan.y.toFixed(2) + 'px,0)' : ''; }

  function showTitle(g){ titleEl.textContent = g.en || g.title; titleEl.hidden = false; }
  function hideTitle(){ titleEl.hidden = true; }
  function heat(t, by){
    if (locked || narrow() || view !== 'home') return;
    if (hot && hot !== t) hot.a.classList.remove('hot');
    hot = t; hotBy = by; t.a.classList.add('hot'); showTitle(t.g);
    ring.classList.toggle('on', by === 'mouse');
  }
  function cool(){
    if (locked) return;
    if (hot){ hot.a.classList.remove('hot'); hot = null; hotBy = ''; hideTitle(); }
    ring.classList.remove('on');
  }
  /* which photo is under the pointer right now (the canvas also slides under a still pointer) */
  function probe(moved){
    if (!mouse.seen || locked || busy || view !== 'home' || narrow() || !fine() || !about.hidden) return;
    var e = doc.elementFromPoint(mouse.x, mouse.y), a = e && e.closest ? e.closest('.tile') : null, t = null;
    if (a) for (var i = 0; i < tiles.length; i++) if (tiles[i].a === a){ t = tiles[i]; break; }
    if (t){ if (hot !== t || hotBy !== 'mouse') heat(t, 'mouse'); }
    else if (hot && (hotBy === 'mouse' || moved)) cool();
  }

  /* ---------- mouse: ring + opposed pan ---------- */
  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true;
    ring.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
    probe(true);
  }, { passive:true });
  doc.addEventListener('mouseleave', function(){ if (hotBy === 'mouse') cool(); ring.classList.remove('on'); });

  function panLoop(){
    var t = now(), dt = Math.min(100, t - panLast); panLast = t;
    if (panOn && mouse.seen && !narrow() && fine() && !calm() && view === 'home'){
      var tx = -(mouse.x - window.innerWidth / 2) * 0.5;
      var ty = -(mouse.y - window.innerHeight / 2) * 0.5;
      var k = 1 - Math.exp(-dt / 110);
      pan.x += (tx - pan.x) * k; pan.y += (ty - pan.y) * k;
      if (Math.abs(tx - pan.x) < .05) pan.x = tx;
      if (Math.abs(ty - pan.y) < .05) pan.y = ty;
      var was = stage.style.transform;
      setPan();
      if (stage.style.transform !== was) probe(false);
    }
    raf(panLoop);
  }

  /* ---------- intro ---------- */
  var loader = $('loader');
  function burst(done){
    setP(0); setBusy(true);
    raf(function(){ run(950, outQuart, setP, function(){ setP(1); setBusy(false); panOn = true; probe(false); if (done) done(); }); });
  }
  function intro(){
    if (narrow() || calm()){
      loader.style.display = 'none'; setP(1); setNav(1); setBusy(false); panOn = true; return;
    }
    setP(0); setNav(0);
    var t0 = now(), started = false, left = tiles.length;
    function go(){
      if (started) return; started = true;
      burst();
      setTimeout(function(){ loader.style.display = 'none'; }, 120);
      setTimeout(function(){ run(600, outCubic, setNav, function(){ setNav(1); }); }, 420);
    }
    function ready(){ var w = 1380 - (now() - t0); if (w > 0) setTimeout(go, w); else go(); }
    tiles.forEach(function(t){
      function one(){ if (--left === 0) ready(); }
      if (t.img.complete) one(); else { t.img.addEventListener('load', one); t.img.addEventListener('error', one); }
    });
    setTimeout(go, 2600);           /* never hold the white screen longer than this */
  }

  /* ---------- pick a tile ---------- */
  function pick(t){
    if (busy || view !== 'home') return;
    lastTile = t;
    if (narrow() || calm()){ openDetail(t, false); return; }
    setBusy(true); locked = true; panOn = false;
    if (hot && hot !== t) hot.a.classList.remove('hot');
    hot = t; hotBy = 'pick'; t.a.classList.add('hot'); showTitle(t.g);
    ring.classList.remove('on');
    var px = pan.x, py = pan.y;
    run(900, inOut, function(e){ setP(1 - e); pan.x = px * (1 - e); pan.y = py * (1 - e); setPan(); });
    setTimeout(function(){ run(200, inOut, function(e){ setNav(1 - e); }); }, 1000);
    setTimeout(function(){
      tiles.forEach(function(o){ if (o !== t) o.a.classList.add('gone'); });
      t.a.classList.add('grow');
      t.img.style.setProperty('--s', (52 / t.pl.h).toFixed(4));
    }, 1430);
    setTimeout(function(){ openDetail(t, true); }, 1800);
  }

  /* ---------- category view: heading + grid of thumbnails ----------
     並べる写真は data/selection.js のまとまりごとの `gallery`（無ければ `items`）。               */
  var detail = $('detail'), list = detail.querySelector('ol'), dhead = detail.querySelector('h2');
  var cur = null;                      /* { g, items[], btns[] } while a category is open */
  function galleryOf(g){ return (g.gallery && g.gallery.length ? g.gallery : (g.items || [])).slice(); }
  function openDetail(t, carried){
    var g = t.g, items = galleryOf(g);
    list.textContent = '';
    dhead.textContent = '— ' + (g.en || g.title) + ' —';
    dhead.setAttribute('aria-label', g.title);
    cur = { g:g, items:items, btns:[] };
    items.forEach(function(src, n){
      var li = el('li'), sz = SIZES[src];
      li.style.setProperty('--n', Math.min(n, 14));
      if (sz && sz[0] / sz[1] > 1.25) li.className = 'wide';
      var b = el('button'); b.type = 'button'; b.setAttribute('aria-label', g.title + ' ' + (n + 1) + ' を拡大表示');
      var im = el('img'); im.alt = ''; im.decoding = 'async'; im.draggable = false;
      if (sz){ im.width = sz[0]; im.height = sz[1]; }
      im.src = src;
      b.appendChild(im); li.appendChild(b); list.appendChild(li);
      b.addEventListener('click', function(){ openLb(n); });
      cur.btns.push(b);
    });
    view = 'detail';
    body.classList.add('in-detail'); body.classList.add('locked');
    $('foot').style.visibility = 'hidden';
    $('openAbout').hidden = true; $('mail').hidden = true;
    $('gname').textContent = g.title; $('gname').hidden = false; $('closeDetail').hidden = false;
    detail.classList.remove('shown'); body.classList.remove('deep');
    detail.hidden = false; detail.scrollTop = 0;
    void detail.offsetWidth;
    detail.classList.add('shown');
    if (carried){
      /* the canvas, with the picked photo in its centre, stays underneath while the list fades in over it */
      setTimeout(function(){ if (view === 'detail'){ stage.style.visibility = 'hidden'; hideTitle(); } }, 380);
      setNav(0); run(400, outCubic, setNav, function(){ setNav(1); });
    } else { stage.style.visibility = 'hidden'; hideTitle(); setNav(1); }
    $('closeDetail').focus({ preventScroll:true });
    try { history.pushState({ g:g.id }, '', '#' + g.id); } catch (err) {}
  }
  function closeDetail(fromPop){
    if (view !== 'detail') return;
    if (lbOn) closeLb(true);
    view = 'home';
    detail.hidden = true; detail.classList.remove('shown'); list.textContent = ''; cur = null;
    body.classList.remove('in-detail'); body.classList.remove('locked'); body.classList.remove('deep');
    stage.style.visibility = ''; $('foot').style.visibility = '';
    $('openAbout').hidden = false; $('mail').hidden = !PRO.email;
    $('gname').hidden = true; $('closeDetail').hidden = true;
    hideTitle(); locked = false;
    tiles.forEach(function(o){ o.a.classList.remove('gone', 'grow', 'hot'); o.img.style.removeProperty('--s'); });
    hot = null; hotBy = ''; pan.x = pan.y = 0; setPan(); setNav(1);
    if (!fromPop){ try { var st = history.state; if (st && st.g) history.go(st.lb ? -2 : -1); } catch (err) {} }
    if (narrow() || calm()){ setP(1); setBusy(false); panOn = true; }
    else burst();                     /* photos open out from the centre again */
    if (lastTile) lastTile.a.focus({ preventScroll:true });
  }
  $('closeDetail').addEventListener('click', function(){ closeDetail(false); });
  detail.addEventListener('scroll', function(){ body.classList.toggle('deep', view === 'detail' && detail.scrollTop > 24); }, { passive:true });
  window.addEventListener('popstate', function(e){
    var keep = e.state && e.state.g;                /* still inside a category after this step back */
    if (lbOn){ closeLb(true); if (keep) return; }
    if (view === 'detail' && !keep) closeDetail(true);
  });

  /* ---------- lightbox: one photo large, previous / next, swipe ---------- */
  var lb = $('lb'), lbFig = lb.querySelector('figure'), lbImg = lb.querySelector('img'), lbCt = lb.querySelector('.ct');
  var lbPrev = lb.querySelector('.pv'), lbNext = lb.querySelector('.nx'), lbX = lb.querySelector('.x');
  var lbOn = false, lbOrder = [], lbPos = 0, lbTok = 0;
  function two(n){ return (n < 10 ? '0' : '') + n; }
  /* the order the thumbnails are seen in (row by row, left to right); a spread that moves down a row changes it */
  function seenOrder(){
    var r = cur.btns.map(function(b, i){ var q = b.getBoundingClientRect(); return { i:i, t:Math.round(q.top), l:q.left }; });
    r.sort(function(a, b){ return (a.t - b.t) || (a.l - b.l); });
    return r.map(function(o){ return o.i; });
  }
  function lbShow(pos, dir, fromX){
    var n = lbOrder.length; lbPos = ((pos % n) + n) % n;
    var src = cur.items[lbOrder[lbPos]], my = ++lbTok, quiet = calm() || !dir;
    lbCt.textContent = two(lbPos + 1) + ' / ' + two(n);
    function place(){
      if (my !== lbTok || !lbOn) return;
      lbImg.src = src; lbImg.alt = cur.g.title + ' ' + (lbPos + 1);
      lbFig.style.transition = 'none';
      if (quiet){ lbFig.style.transform = ''; lbFig.style.opacity = ''; void lbFig.offsetWidth; lbFig.style.transition = ''; return; }
      lbFig.style.transform = 'translate3d(' + (dir * 28) + 'px,0,0)'; lbFig.style.opacity = '0';
      void lbFig.offsetWidth;
      lbFig.style.transition = ''; lbFig.style.transform = ''; lbFig.style.opacity = '';
    }
    if (quiet) place();
    else {
      /* the photo leaves towards where it was pushed, the next one arrives from the other side */
      lbFig.style.transition = '';
      lbFig.style.transform = 'translate3d(' + ((fromX || 0) - dir * 28).toFixed(1) + 'px,0,0)'; lbFig.style.opacity = '0';
      var t0 = now(), went = false, pre = new Image();
      var go = function(){ if (went) return; went = true; var w = 170 - (now() - t0); setTimeout(place, w > 0 ? w : 0); };
      pre.onload = pre.onerror = go; pre.src = src; if (pre.complete) go();
      setTimeout(go, 1500);
    }
    if (n > 1) [1, -1].forEach(function(d){ var p = new Image(); p.src = cur.items[lbOrder[(lbPos + d + n) % n]]; });
  }
  function openLb(n){
    if (!cur || lbOn) return;
    lbOrder = seenOrder();
    lbOn = true; lb.hidden = false; lb.classList.remove('on'); body.classList.add('lb-open');
    lb.classList.toggle('one', lbOrder.length < 2);
    lbShow(lbOrder.indexOf(n), 0);
    void lb.offsetWidth; lb.classList.add('on');
    lbX.focus({ preventScroll:true });
    try { history.pushState({ g:cur.g.id, lb:1 }, '', '#' + cur.g.id); } catch (err) {}
  }
  function closeLb(fromPop){
    if (!lbOn) return;
    lbOn = false; lbTok++;
    lb.classList.remove('on'); body.classList.remove('lb-open');
    setTimeout(function(){ if (!lbOn){ lb.hidden = true; lbImg.removeAttribute('src'); lbFig.style.transform = ''; lbFig.style.opacity = ''; } }, calm() ? 0 : 260);
    /* back in the list, at the photo that was just on screen */
    var b = cur && cur.btns[lbOrder[lbPos]];
    if (b && view === 'detail'){ if (b.scrollIntoView) b.scrollIntoView({ block:'nearest' }); b.focus({ preventScroll:true }); }
    if (!fromPop){ try { if (history.state && history.state.lb) history.back(); } catch (err) {} }
  }
  lbX.addEventListener('click', function(){ closeLb(false); });
  lbPrev.addEventListener('click', function(){ lbShow(lbPos - 1, -1); });
  lbNext.addEventListener('click', function(){ lbShow(lbPos + 1, 1); });
  lb.addEventListener('click', function(e){ if (e.target === lb || e.target === lbFig) closeLb(false); });   /* the white around the photo */
  var sw = null;
  lb.addEventListener('touchstart', function(e){
    sw = e.touches.length === 1 ? { x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, dy:0, lock:'' } : null;
  }, { passive:true });
  lb.addEventListener('touchmove', function(e){
    if (!sw) return;
    sw.dx = e.touches[0].clientX - sw.x; sw.dy = e.touches[0].clientY - sw.y;
    if (!sw.lock && (Math.abs(sw.dx) > 8 || Math.abs(sw.dy) > 8)) sw.lock = Math.abs(sw.dx) > Math.abs(sw.dy) ? 'x' : 'y';
    if (sw.lock === 'x' && lbOrder.length > 1){ lbFig.style.transition = 'none'; lbFig.style.transform = 'translate3d(' + sw.dx.toFixed(1) + 'px,0,0)'; }
  }, { passive:true });
  function swEnd(){
    if (!sw) return;
    var q = sw; sw = null;
    lbFig.style.transition = '';
    if (q.lock === 'x' && Math.abs(q.dx) > 48 && lbOrder.length > 1) lbShow(lbPos + (q.dx < 0 ? 1 : -1), q.dx < 0 ? 1 : -1, q.dx);
    else lbFig.style.transform = '';
  }
  lb.addEventListener('touchend', swEnd);
  lb.addEventListener('touchcancel', swEnd);

  /* ---------- profile ---------- */
  var about = $('about');
  (function(){
    var box = about.querySelector('.in');
    box.appendChild(el('h2', null, nameEn));
    box.appendChild(el('p', 'k', (PRO.nameJa || '') + '｜スタイリスト'));
    box.appendChild(el('p', null, ''));
    if (PRO.lead) box.appendChild(el('p', null, PRO.lead));
    (PRO.bio || []).forEach(function(line){ box.appendChild(el('p', null, line)); });
    if (PRO.specialty) box.appendChild(el('p', null, PRO.specialty));
    if (PRO.email){ var p = el('p'); var m = el('a', null, PRO.email); m.href = 'mailto:' + PRO.email; p.appendChild(m); box.appendChild(p); }
    if (PRO.instagram){ var p2 = el('p'); var ig = el('a', null, 'Instagram'); ig.href = PRO.instagram; ig.rel = 'noopener'; p2.appendChild(ig); box.appendChild(p2); }
  })();
  var aboutFrom = null;
  function openAbout(){ cool(); aboutFrom = doc.activeElement; about.hidden = false; about.scrollTop = 0; body.classList.add('locked'); ring.classList.remove('on'); $('closeAbout').focus({ preventScroll:true }); }
  function closeAbout(){ if (about.hidden) return; about.hidden = true; if (view === 'home') body.classList.remove('locked'); if (aboutFrom && aboutFrom.focus) aboutFrom.focus({ preventScroll:true }); }
  $('openAbout').addEventListener('click', openAbout);
  $('closeAbout').addEventListener('click', closeAbout);

  $('home').addEventListener('click', function(e){
    e.preventDefault();
    if (!about.hidden) closeAbout();
    if (view === 'detail') closeDetail(false);
    else if (narrow()) window.scrollTo(0, 0);
  });
  doc.addEventListener('keydown', function(e){
    if (lbOn){
      if (e.key === 'Escape') closeLb(false);
      else if (e.key === 'ArrowLeft') lbShow(lbPos - 1, -1);
      else if (e.key === 'ArrowRight') lbShow(lbPos + 1, 1);
      else if (e.key === 'Tab'){                       /* keep the keyboard inside the enlarged view */
        var f = [lbPrev, lbNext, lbX].filter(function(b){ return b.offsetParent !== null; });
        e.preventDefault();
        f[(f.indexOf(doc.activeElement) + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
      return;
    }
    if (e.key !== 'Escape') return;
    if (!about.hidden) closeAbout(); else if (view === 'detail') closeDetail(false);
  });

  /* ---------- 文字色の候補（確認用。決まったらこのブロックと #tones を消す） ---------- */
  (function(){
    var TONES = ['sand', 'dusk', 'clay', 'red'], box = $('tones');
    function set(t, keep){
      if (TONES.indexOf(t) < 0) t = TONES[0];
      root.setAttribute('data-tone', t);
      Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-tone') === t)); });
      if (keep){ try { localStorage.setItem('tone', t); } catch (err) {} }
    }
    set(root.getAttribute('data-tone'), false);
    box.addEventListener('click', function(e){ var b = e.target.closest ? e.target.closest('button') : null; if (b) set(b.getAttribute('data-tone'), true); });
  })();

  /* ---------- foot (narrow list only) ---------- */
  (function(){
    var f = $('foot');
    function line(node){ var p = el('p'); if (typeof node === 'string') p.textContent = node; else p.appendChild(node); f.appendChild(p); }
    line(PRO.nameJa || '伊藤 あかり');
    line('スタイリスト');
    var b = el('button', null, 'プロフィール'); b.type = 'button'; b.addEventListener('click', openAbout); line(b);
    if (PRO.instagram){ var ig = el('a', null, 'Instagram'); ig.href = PRO.instagram; ig.rel = 'noopener'; line(ig); }
    if (PRO.email){ var m = el('a', null, PRO.email); m.href = 'mailto:' + PRO.email; line(m); }
    if ('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ es.forEach(function(en){ if (en.isIntersecting) f.classList.add('in'); }); }, { threshold:.2 }).observe(f);
    } else f.classList.add('in');
  })();

  /* ---------- crossing the breakpoint ---------- */
  function onMode(){
    if (view === 'home' && !locked){ setP(1); setNav(1); pan.x = pan.y = 0; setPan(); loader.style.display = 'none'; setBusy(false); panOn = true;
      cool(); }
  }
  if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', onMode);

  panLast = now(); raf(panLoop);
  intro();
})();
</script>
</body>
</html>
