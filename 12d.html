<!doctype html>
<html lang="ja" class="nf">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊藤 あかり｜スタイリスト</title>
<meta name="description" content="スタイリスト 伊藤 あかりの作品集。">
<link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 12D ＝ W（名前は動かず、後ろの写真だけが切り替わる始まり）→ G（r1-gregor の写真の壁）。
   色：大きな文字 tint #a39166／小さな文字と線 ink #786850／地は r1 と同じ生成り。 */
@font-face {
  font-family: "Archivo R1";
  src: url(assets/fonts/archivo-var-latin.woff2) format("woff2");
  font-weight: 100 900;
  font-stretch: 62% 125%;
  font-display: block;
}
:root {
  --paper: #F5F3F0;
  --ink: #786850;
  --tint: #a39166;
  --big: clamp(36px, 5.5vw, 82px);
  --mid: clamp(21px, 3.4vw, 44px);
  --flip: cubic-bezier(.77, 0, .175, 1);
  --veil-ease: cubic-bezier(.5, 0, .5, 1);
  --veil-time: .49s;
  --plus: 32px;
  --plus-top: 16px;
  --pad: 16px;
}
@media (max-width: 768px) {
  :root { --plus: 24px; --plus-top: 12px; --pad: 12px; }
}
* { box-sizing: border-box; }
html {
  background: var(--paper);
  color: var(--ink);
  scrollbar-width: none;
  -webkit-text-size-adjust: 100%;
  overflow-anchor: none;
}
html::-webkit-scrollbar { display: none; }
html.is-locked { overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo R1", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 800;
  font-stretch: 71%;
  text-transform: uppercase;
  letter-spacing: .02em;
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.small {
  font-family: Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 400;
  font-stretch: 100%;
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.4;
}

/* ---------- 写真の帯（r1 と同じ） ---------- */
#track {
  position: relative;
  z-index: 2;
  width: 100%;
  overflow: hidden;
  overflow: clip;
}
#block { position: absolute; left: 0; top: 0; width: 100%; height: 0; }
.ph { position: absolute; display: block; transform-origin: 50% 50%; }
.ph img { width: 100%; height: 100%; }
.ph[hidden] { display: none; }

/* ---------- 始まり（W）：名前の後ろで写真が 1 コマで切り替わる。写真は切らず、画面に収まる大きさで全体を見せる ---------- */
#open {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  z-index: 3;
  background: var(--paper);
  overflow: hidden;
}
#open[hidden] { display: none; }
#open img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; visibility: hidden; }
#open img.on { visibility: visible; }

/* ---------- 真ん中の名前：最初のコマからここにあり、動かない。写真の壁より上 ---------- */
#center {
  position: fixed;
  left: 50%; top: 50%;
  z-index: 4;
  transform: translate(-50%, -50%);
  pointer-events: none;
  text-align: center;
}
html.nf #center { visibility: hidden; }           /* 書体が届くまで出さない（出てから幅が変わらないように） */
#name {
  margin: 0;
  font-size: max(36px, min(10vw, 15.5vh));
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1;
  max-width: 90vw;
  width: max-content;
  white-space: nowrap;
  color: var(--tint);
}
html.w-ink #name { color: var(--ink); }           /* 写真の上にあるあいだは濃い色、生成りの地に戻ったら淡い色（切り替えと同じコマ） */
@media (max-width: 768px) {
  #name { font-size: max(36px, min(17.5vw, 11vh)); }
}
#sub {
  position: absolute;
  left: 50%; top: 100%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  white-space: nowrap;
}
#who { margin: 8px 0 0; font-size: 13px; }
#contact {
  pointer-events: auto;
  display: flex; align-items: center;
  min-height: 40px; padding: 0 10px;
  font-size: 13px;
}
#contact span { border-bottom: 1px solid var(--ink); padding-bottom: 1px; }
@media (max-width: 768px) { #who { margin-top: 6px; font-size: 12px; } #contact { font-size: 12px; } }

/* ---------- 加号 ---------- */
#toggle {
  position: fixed;
  left: 50%;
  top: calc(var(--plus-top) - (44px - var(--plus)) / 2);
  z-index: 50;
  width: 44px; height: 44px;
  margin: 0 0 0 -22px;
  display: grid; place-items: center;
}
#plus {
  position: relative;
  display: block;
  width: var(--plus); height: var(--plus);
  transition: transform .79s var(--flip);
}
#plus::before, #plus::after {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 100%; height: 3px;
  margin-top: -1.5px;
  background: var(--ink);
}
#plus::after { transform: rotate(90deg); }
.menu-open #plus { transform: rotate(135deg); }
.lb-open #toggle, .lb-open #closeDetail { visibility: hidden; }

/* ---------- ぼかし＋生成りの幕（メニューの後ろ） ---------- */
#veil {
  position: fixed; inset: 0;
  z-index: 20;
  pointer-events: none;
  background-color: rgba(245, 243, 240, 0);
  -webkit-backdrop-filter: blur(0px);
  backdrop-filter: blur(0px);
  transition: background-color var(--veil-time) var(--veil-ease),
              -webkit-backdrop-filter var(--veil-time) var(--veil-ease),
              backdrop-filter var(--veil-time) var(--veil-ease);
}
.veil-on #veil {
  background-color: rgba(245, 243, 240, 1);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  pointer-events: auto;
}
.veil-idle #veil { -webkit-backdrop-filter: none; backdrop-filter: none; transition: none; }

/* ---------- メニュー：ジャンル ＋ プロフィール ＋ 連絡先 ---------- */
#menu {
  position: fixed; inset: 0;
  z-index: 40;
  display: flex; flex-direction: column;
  padding: calc(var(--plus-top) + var(--plus) + 16px) var(--pad) var(--pad);
  overflow-y: auto;
  overscroll-behavior: contain;
  visibility: hidden;
  text-align: center;
}
.menu-open #menu, .menu-closing #menu { visibility: visible; }
.m-items {
  flex: 1 0 auto;
  min-height: 34vh;
  display: flex; flex-wrap: wrap;
  align-items: center; align-content: center; justify-content: center;
  gap: 0 .5em;
  margin: 0 auto; padding: 0 0 2vh;
  max-width: 1200px;
  list-style: none;
  font-size: var(--big);
  letter-spacing: .02em;
  line-height: 1;
  color: var(--tint);
}
.m-items li { margin: 0; padding: 0; }
.m-items a { display: block; padding: .06em 0; }
.m-bio {
  flex: 0 0 auto;
  margin: 0 auto;
  padding: 0 0 5vh;
  max-width: 1360px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.25;
}
.m-bio p { margin: 0; }
.m-bio p + p { margin-top: .6em; }
.m-foot {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.2;
}
.m-foot a { display: inline-block; min-height: 40px; }
.m-mail { text-transform: none; }
.m-sns { display: flex; gap: .6em; }
.m-sns a { min-width: 40px; text-align: right; }
.m-copy {
  position: absolute;
  left: 50%; bottom: var(--pad);
  transform: translateX(-50%);
  margin: 0;
  white-space: nowrap;
  font-size: 11px;
}
@media (max-width: 768px) {
  .m-items { flex-direction: column; flex-wrap: nowrap; gap: 0; }
  .m-items a { padding: 5px 12px; }
  .m-copy { position: static; transform: none; margin-top: 14px; }
}
.ln { display: block; }
.ln-i {
  display: block;
  transform: perspective(800px) translateY(50%) rotateX(-40deg);
  filter: blur(12px);
  opacity: 0;
  transition: none;
}
.menu-open .ln-i {
  transform: none; filter: blur(0px); opacity: 1;
  transition: transform .79s var(--flip) var(--d, 0s), filter .79s var(--flip) var(--d, 0s), opacity .79s var(--flip) var(--d, 0s);
}
.menu-closing .ln-i {
  transform: perspective(800px) translateY(-50%) rotateX(40deg);
  filter: blur(12px); opacity: 0;
  transition: transform .5s var(--flip), filter .5s var(--flip), opacity .5s var(--flip);
}
#menu a { text-decoration: underline; text-decoration-color: transparent; text-underline-offset: .12em; text-decoration-thickness: 2px; text-decoration-skip-ink: none; }
#menu .m-items a { text-decoration-thickness: 4px; }
@media (max-width: 768px) { #menu .m-items a { text-decoration-thickness: 3px; } }
#menu a:hover, #menu a:focus-visible, #menu a[aria-current] { text-decoration-color: var(--ink); }

/* ---------- ジャンルの一覧：見出し ＋ 小さい写真の格子（r4-snog と同じふるまい） ---------- */
#detail {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  z-index: 10;
  overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--paper);
  opacity: 0;
  transition: opacity .35s linear;
}
#detail[hidden] { display: none; }
#detail.shown { opacity: 1; }
#detail:focus-visible { outline: none; }
#detail .in { max-width: 1180px; margin: 0 auto; padding: calc(var(--plus-top) + var(--plus) + 7vh) 24px 16vh; }
#detail h2 {
  margin: 0 0 6vh;
  text-align: center;
  font-size: clamp(22px, 2.4vw, 34px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: .04em;
  text-transform: none;
  white-space: nowrap;
  color: var(--ink);
}
#detail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 3.4vw, 52px); align-items: start; grid-auto-flow: dense; }
#detail ol li.wide { grid-column: span 2; }                 /* 見開きの誌面は 2 列ぶん */
#detail ol li { opacity: 0; transform: translateY(18px); transition: opacity .5s ease-out, transform .5s ease-out; transition-delay: calc(var(--n, 0) * 35ms + 300ms); }
#detail.shown ol li { opacity: 1; transform: none; }
#detail h2, #detail .more { opacity: 0; transition: opacity .4s linear .3s; }
#detail.shown h2, #detail.shown .more { opacity: 1; }
#detail ol li button { display: block; width: 100%; cursor: zoom-in; }
#detail ol li img { width: 100%; height: auto; transition: opacity .2s linear; }   /* 写真は切らない：幅に合わせて高さは成り行き */
#detail ol li button:hover img { opacity: .8; }
#detail .more { margin: 14vh 0 0; text-align: center; }
#detail .more .k { margin: 0 0 20px; font-size: 13px; }
#detail .more ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 clamp(22px, 3.2vw, 52px); }
#detail .more li button { font-size: var(--big); line-height: 1.2; white-space: nowrap; color: var(--tint); }
#detail .more li button:hover, #detail .more li button:focus-visible { color: var(--ink); }
#detail .more .c { margin: 9vh 0 0; font-size: 15px; line-height: 1.6; }
#detail .more .c a { display: inline-block; padding: 9px 0; border-bottom: 1px solid var(--ink); }
.x { position: relative; width: 44px; height: 44px; background: var(--paper); }
.x::before, .x::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 2px; background: var(--ink); transform: translate(-50%, -50%) rotate(45deg); }
.x::after { transform: translate(-50%, -50%) rotate(-45deg); }
.x[hidden] { display: none; }
#closeDetail { position: fixed; right: var(--pad); top: calc(var(--plus-top) - (44px - var(--plus)) / 2); z-index: 12; }
.in-detail #toggle { background: var(--paper); }

/* ---------- 拡大：1 枚を大きく、前へ／次へ ---------- */
#lb {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  z-index: 60;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity .25s linear;
  touch-action: pan-y pinch-zoom;
  -webkit-user-select: none; user-select: none;
}
#lb[hidden] { display: none; }
#lb.on { opacity: 1; }
#lb figure { flex: none; margin: auto; transition: transform .17s ease-out, opacity .17s linear; will-change: transform; }
#lb img { max-width: calc(100vw - 2 * max(64px, 9vw) - 20px); max-height: min(86vh, calc(100vh - 96px)); width: auto; height: auto; object-fit: contain; }
#lb .x { position: fixed; right: var(--pad); top: var(--pad); z-index: 2; }
#lb .nv { position: fixed; top: 0; bottom: 0; width: max(64px, 9vw); z-index: 1; display: flex; align-items: center; justify-content: center; }
#lb .pv { left: 0; }
#lb .nx { right: 0; }
#lb .nv::before { content: ""; width: 16px; height: 16px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(4px) rotate(45deg); }
#lb .nx::before { transform: translateX(-4px) rotate(-135deg); }
#lb.one .nv { display: none; }
#lb .ct { position: fixed; left: 0; right: 0; bottom: var(--pad); margin: 0; text-align: center; pointer-events: none; font-size: 13px; }
.fine #lb img.can { cursor: zoom-in; }                      /* パソコン：写真を押すと元の大きさ。もう一度押すと戻る */
#lb.zoom { overflow: auto; align-items: flex-start; }
#lb.zoom figure { padding: 56px 0 64px; }
#lb.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
#lb.zoom .nv, #lb.zoom .ct { display: none; }
#lb .nv:focus-visible { outline: none; }
#lb .nv:focus-visible::before { outline: 2px solid var(--ink); outline-offset: 12px; }

@media (max-width: 768px) {
  #detail .in { padding: calc(var(--plus-top) + var(--plus) + 44px) 10px 16vh; }
  #detail h2 { font-size: 22px; margin-bottom: 28px; }
  #detail ol { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  #detail .more .k { font-size: 12px; }
  #detail .more .c { font-size: 14px; }
  #lb img { max-width: calc(100vw - 20px); max-height: min(74vh, calc(100vh - 124px)); }
  #lb .nv { top: auto; bottom: 4px; height: 52px; width: 72px; }
  #lb .ct { bottom: 23px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

<div id="center">

  /* ---------- 拡大：1 枚を大きく、前へ／次へ、スワイプ ----------
