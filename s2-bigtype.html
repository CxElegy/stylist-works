<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== 3B：とても大きな名前と、大きな見出し語 =====
       参考：審美図鑑「Julia Johnson」。白地＋黒。細長く太い欧文（Anton）を画面幅いっぱいに。
       写真は「まず1点を大きく、次に2点、3点」と段ごとに数を変える。色は相談ボタンだけ（青） */
    @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin.woff2) format("woff2"); font-display: block; }
    :root {
      --bg: #ffffff; --ink: #000000; --accent: #2F6BFF;
      --display: "Anton", Impact, "Arial Narrow", sans-serif;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --pad: 16px; --gap: 6px;
      --lb-bg: #000000; --lb-fg: #ffffff; --lb-font: var(--sans);
    }
    @media (min-width: 900px) { :root { --pad: 32px; --gap: 10px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.8; text-wrap: pretty; line-break: strict; }
    a { color: inherit; text-decoration: none; }
    p, h1, h2 { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    .wrap { padding: 0 var(--pad); }
    #sets:empty { min-height: 100svh; }

    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px var(--pad); }
    .bar__who { font-weight: 700; letter-spacing: .08em; }
    .cta { display: inline-block; background: var(--accent); color: #ffffff; font-weight: 700; padding: 9px 18px; white-space: nowrap; }
    .cta:hover, .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .lead { padding: 0 var(--pad); max-width: 36em; font-size: 15px; line-height: 1.7; }
    .name { font-family: var(--display); font-weight: 400; text-transform: uppercase; white-space: nowrap; line-height: 1.05; font-size: 21.5vw; padding: 0 var(--pad); margin-top: 4px; }

    .set { margin-top: 56px; }
    .set--lead { margin-top: 8px; }
    .set__head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 14px; padding-bottom: 4px; border-bottom: 3px solid var(--ink); margin-bottom: var(--gap); }
    .set__word { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(48px, 11vw, 150px); line-height: 1.08; }
    .set__ja { font-weight: 700; font-size: 15px; }
    .set__note { font-size: 14px; }

    .row { display: flex; gap: var(--gap); align-items: flex-start; }
    .row + .row { margin-top: var(--gap); }
    .ph { flex: 1 1 0; min-width: 0; }
    .ph__btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
    .ph__btn:hover img, .ph__btn:focus-visible img { opacity: .85; }
    .ph__btn:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .ph__cap { font-size: 13px; font-weight: 700; line-height: 1.5; margin-top: 4px; }

    .about { display: grid; gap: 20px; max-width: 1100px; }
    .about__bio p + p { margin-top: .6em; }
    .about dl { margin: 0; }
    .about dt { font-weight: 700; margin-top: 10px; }
    .about dd { margin: 0; }
    @media (min-width: 900px) { .about { grid-template-columns: 1.2fr 1fr; gap: 56px; } }
    .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 12px; }
    .contact a:not(.cta) { border-bottom: 1px solid currentColor; }
    .foot { margin-top: 56px; padding: 0 var(--pad) 24px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header id="top">
    <div class="bar">
      <p class="bar__who"><span data-p="nameJa">伊藤 あかり</span>｜スタイリスト</p>
      <a class="cta" href="#contact">仕事を相談する</a>
    </div>
    <p class="lead" data-p="lead">ビューティーからファッション、キッズまで。雑誌・広告・カタログのスタイリングを手がけています。</p>
    <h1 class="name">Akari Ito</h1>
  </header>

  <main class="wrap" id="sets"></main>

  <div class="wrap">
    <section class="set" id="profile">
      <div class="set__head"><h2 class="set__word">Profile</h2><span class="set__ja">プロフィール</span></div>
      <div class="about">
        <div class="about__bio" data-p="bio"></div>
        <dl><dt>得意分野</dt><dd data-p="specialty"></dd></dl>
      </div>
    </section>
    <section class="set" id="contact">
      <div class="set__head"><h2 class="set__word">Contact</h2><span class="set__ja">お仕事のご依頼・ご相談</span></div>
      <div class="contact">
        <a class="cta" data-mail href="#">メールで相談する</a>
        <a data-p="email" href="#"></a>
        <a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>
  </div>
  <footer class="foot">© <span data-year></span> Akari Ito</footer>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/selection.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    (function () {
      var E = Portfolio.el, P = window.PROFILE, data = Portfolio.sets(), main = document.getElementById("sets");
      data.sets.forEach(function (s) {
        var sec = E("section", "set" + (s.lead ? " set--lead" : "")); sec.id = s.id;
        var head = E("div", "set__head");
        head.appendChild(E("h2", "set__word", s.en));
        head.appendChild(E("span", "set__ja", s.title));
        if (s.note) head.appendChild(E("span", "set__note", s.note));
        if (s.lead) sec.setAttribute("aria-label", s.title); else sec.appendChild(head);
        var mixed = {}; s.works.forEach(function (w) { mixed[w.media || ""] = 1; });
        var showCap = Object.keys(mixed).length > 1;
        s.nodes.forEach(function (d) { d.style.flexGrow = d._r.toFixed(4); if (showCap && d._w.media) d.appendChild(E("p", "ph__cap", d._w.media)); });
        s.body = sec.appendChild(E("div", ""));
        main.appendChild(sec);
      });
      // スマホは段ごとに数を変える：1点（大きく）→ 2点 → 2〜3点。パソコンは1列（写真が画面より高くならないように）
      var mq = window.matchMedia("(min-width: 900px)");
      function chunks(n, wide) {
        if (wide) return [n];
        var out = [1]; n -= 1; while (n > 3) { out.push(2); n -= 2; } if (n) out.push(n); return out;
      }
      function layout() {
        data.sets.forEach(function (s) {
          s.body.innerHTML = ""; var k = 0;
          chunks(s.nodes.length, mq.matches).forEach(function (n) { var row = s.body.appendChild(E("div", "row")); for (var j = 0; j < n; j++) { var d = s.nodes[k++]; d.style.flexGrow = n === 1 ? 1 : d._r.toFixed(4); row.appendChild(d); } });
        });
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout); else mq.addListener(layout);
      var mail = document.querySelector("[data-mail]");
      if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
    })();
  </script>
</body>
</html>
