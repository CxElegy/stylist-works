<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== 3C：写真と文字のコマを交互に並べる（市松）＋大きな明朝の名前 =====
       参考：審美図鑑「Friends of the New」。冷たい薄灰の地＋墨。空きコマは空白にせず、
       まとまりの名前・媒体名・点数を書いた墨色のコマにする。色は相談ボタンだけ（ローズ） */
    :root {
      --bg: #E9ECEF; --ink: #16181D; --accent: #B8336A;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", Georgia, "Times New Roman", serif;
      --pad: 10px; --gap: 4px;
      --lb-bg: #E9ECEF; --lb-fg: #16181D; --lb-font: var(--serif);
    }
    @media (min-width: 900px) { :root { --pad: 24px; --gap: 6px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 15px; line-height: 1.8; text-wrap: pretty; line-break: strict; }
    a { color: inherit; text-decoration: none; }
    p, h1, h2 { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 var(--pad); }
    #sets:empty { min-height: 100svh; }

    .top { padding-top: 20px; padding-bottom: 16px; display: grid; gap: 10px; }
    .name { font-size: clamp(48px, 10.5vw, 150px); font-weight: 400; letter-spacing: -.02em; line-height: 1.05; }
    .role { font-size: 16px; letter-spacing: .12em; }
    .lead { max-width: 32em; }
    .cta { display: inline-block; justify-self: start; background: var(--accent); color: #ffffff; padding: 10px 22px; letter-spacing: .08em; }
    .cta:hover, .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (min-width: 900px) {
      .top { grid-template-columns: 1fr auto; align-items: end; column-gap: 40px; }
      .name { grid-row: span 3; }
    }

    .set + .set { margin-top: var(--gap); }
    .row { display: flex; gap: var(--gap); align-items: stretch; }
    .row + .row { margin-top: var(--gap); }
    .ph { flex: 1 1 0; min-width: 0; }
    .ph__btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
    .ph__btn:hover img, .ph__btn:focus-visible img { opacity: .85; }
    .ph__btn:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    /* 文字のコマ：高さは同じ段の写真にそろう */
    .tile { flex: 0.62 1 0; min-width: 0; background: var(--ink); color: var(--bg); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .tile__no { font-size: 14px; letter-spacing: .1em; }
    .tile__title { font-size: clamp(22px, 2.6vw, 40px); line-height: 1.25; }
    .tile__small { display: block; font-size: 14px; line-height: 1.6; }
    .tile__title { margin: 0; font-weight: 400; }

    .text { margin-top: 48px; border-top: 1px solid var(--ink); padding-top: 12px; display: grid; gap: 12px; }
    .text h2 { font-size: clamp(24px, 3vw, 40px); font-weight: 400; line-height: 1.3; }
    .text dl { margin: 0; }
    .text dt { margin-top: 10px; letter-spacing: .1em; }
    .text dd { margin: 0; }
    .about__bio p + p { margin-top: .6em; }
    @media (min-width: 900px) { .text { grid-template-columns: 1fr 2fr; } }
    .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
    .contact a:not(.cta) { border-bottom: 1px solid currentColor; }
    .foot { margin-top: 48px; padding-bottom: 24px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="wrap top" id="top">
    <h1 class="name" data-p="nameEn">Akari Ito</h1>
    <p class="role"><span data-p="nameJa">伊藤 あかり</span>　スタイリスト</p>
    <p class="lead" data-p="lead">美容誌・生活誌からブランドカタログまで。美的、glow、オレンジページ、BAILA、UNIQLO などのスタイリングを手がけています。</p>
    <a class="cta" href="#contact">仕事を相談する</a>
  </header>

  <main class="wrap" id="sets"></main>

  <div class="wrap">
    <section class="text" id="profile">
      <h2>プロフィール</h2>
      <div>
        <div class="about__bio" data-p="bio"></div>
        <dl><dt>得意分野</dt><dd data-p="specialty"></dd><dt>主な実績</dt><dd data-p="clients"></dd></dl>
      </div>
    </section>
    <section class="text" id="contact">
      <h2>お問い合わせ</h2>
      <div>
        <p>お仕事のご依頼・ご相談はこちらから。</p>
        <div class="contact" style="margin-top:12px">
          <a class="cta" data-mail href="#">メールで相談する</a>
          <a data-p="email" href="#"></a>
          <a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
    </section>
    <footer class="foot">© <span data-year></span> Akari Ito</footer>
  </div>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/selection.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    (function () {
      var E = Portfolio.el, pad = Portfolio.pad, P = window.PROFILE, data = Portfolio.sets(), main = document.getElementById("sets");
      data.sets.forEach(function (s, si) {
        var sec = E("section", "set"); sec.id = s.id;
        s.nodes.forEach(function (d) { d.style.flexGrow = d._r.toFixed(4); });
        // 文字のコマ：番号・まとまりの名前・媒体名・点数
        var t1 = E("div", "tile");
        t1.appendChild(E("span", "tile__no", pad(si + 1) + " / " + pad(data.sets.length)));
        var mid = E("span", ""); mid.appendChild(E("h2", "tile__title", s.title)); mid.appendChild(E("span", "tile__small", s.en)); t1.appendChild(mid);
        var medias = []; s.works.forEach(function (w) { if (w.media && medias.indexOf(w.media) === -1) medias.push(w.media); });
        t1.appendChild(E("span", "tile__small", (medias.join("、") || s.note || "") + "　" + s.works.length + "点"));
        s.t1 = t1;
        s.body = sec.appendChild(E("div", ""));
        main.appendChild(sec);
      });
      // 並べ方："P"＝写真、"A"＝文字のコマ。まとまりごとに文字のコマの位置を変える（左端／途中）
      var mq = window.matchMedia("(min-width: 900px)");
      function plan(n, wide, odd) {
        if (wide) { var half = Math.floor(n / 2), pat = ""; for (var q = 0; q < n; q++) pat += (q === (odd ? half : 0) ? "A" : "") + "P"; return [pat]; }
        var rows = [odd ? "PA" : "AP"], left = n - 1;
        while (left > 3) { rows.push("PP"); left -= 2; }
        if (left) rows.push("PPP".slice(0, left));
        return rows;
      }
      function layout() {
        data.sets.forEach(function (s, si) {
          s.body.innerHTML = ""; var k = 0;
          plan(s.nodes.length, mq.matches, si % 2 === 1).forEach(function (pat) {
            var row = s.body.appendChild(E("div", "row"));
            pat.split("").forEach(function (c) { row.appendChild(c === "A" ? s.t1 : s.nodes[k++]); });
          });
        });
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout); else mq.addListener(layout);
      var mail = document.querySelector("[data-mail]");
      if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
    })();
  </script>
</body>
</html>
