# サイトを GitHub Pages に公開する（このブランチに push するたびに自動で更新）
name: Publish site
on:
  push:
    branches: [ccr-58f77975-xgz53z, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 「まとめる」と「公開する」を別の仕事に分ける
  # （1つにまとめると、アップロード直後にファイルが見つからず失敗することがあった）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          pip install --quiet pillow && python3 tools/sizes.py  # 写真の縦横サイズ表を作り直す（本人が写真を足しても手作業いらず）
          mkdir _site
          cp -r index.html v2.html a-bold.html b-cool.html c-simple.html assets data images _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
