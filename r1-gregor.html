<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊藤 あかり｜スタイリスト</title>
<meta name="description" content="スタイリスト 伊藤 あかりの作品集。">
<link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Archivo R1";
  src: url(assets/fonts/archivo-var-latin.woff2) format("woff2");
  font-weight: 100 900;
  font-stretch: 62% 125%;
  font-display: block;
}
:root {
  --paper: #F5F3F0;
  --ink: #0C0C0C;
  --big: clamp(36px, 5.5vw, 82px);
  --mid: clamp(21px, 3.4vw, 44px);
  --flip: cubic-bezier(.77, 0, .175, 1);
  --veil-ease: cubic-bezier(.5, 0, .5, 1);
  --veil-time: .49s;
  --veil-delay: 0s;
  --plus: 32px;
  --plus-top: 16px;
  --pad: 16px;
}
@media (max-width: 768px) {
  :root { --plus: 24px; --plus-top: 12px; --pad: 12px; }
}
* { box-sizing: border-box; }
html {
  background: var(--paper);
  color: var(--ink);
  scrollbar-width: none;
  -webkit-text-size-adjust: 100%;
  overflow-anchor: none;
}
html::-webkit-scrollbar { display: none; }
html.is-locked { overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo R1", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 800;
  font-stretch: 71%;
  text-transform: uppercase;
  letter-spacing: .02em;
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.small {
  font-family: Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-weight: 400;
  font-stretch: 100%;
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.4;
}

/* ---------- 写真の帯 ---------- */
#track {
  position: relative;
  z-index: 2;
  width: 100%;
  overflow: hidden;
  overflow: clip;
}
#block { position: absolute; left: 0; top: 0; width: 100%; height: 0; }
.ph {
  position: absolute;
  display: block;
  margin: 0; padding: 0; border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ph { transform-origin: 50% 50%; }
.ph img { display: block; width: 100%; height: 100%; }
.ph[hidden] { display: none; }

/* ---------- 真ん中の名前 ---------- */
#center {
  position: fixed;
  left: 50%; top: 50%;
  z-index: 1;
  transform: translate(-50%, -50%);
  pointer-events: none;
  text-align: center;
}
#name {
  margin: 0;
  font-size: max(36px, min(10vw, 15.5vh));   /* 横幅のおよそ 40%。上下の写真に当たらないよう高さでも抑える */
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1;
  max-width: 90vw;
  width: max-content;
}
#name .w { display: inline-block; }
@media (max-width: 768px) {
  #name { font-size: max(36px, min(17.5vw, 11vh)); }   /* スマホも 1 行（横幅のおよそ 70%） */
}
#who {
  position: absolute;
  left: 50%; top: 100%;
  margin: 8px 0 0;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 13px;
}
@media (max-width: 768px) { #who { margin-top: 6px; font-size: 12px; } }
.flip {
  display: block;
  transition: transform .79s var(--flip), filter .79s var(--flip), opacity .79s var(--flip);
}
.is-intro .flip {
  transform: perspective(800px) translateY(50%) rotateX(-40deg);
  filter: blur(12px);
  opacity: 0;
}
.is-reveal .flip { transition-delay: .6s; }

/* ---------- 加号 ---------- */
#toggle {
  position: fixed;
  left: 50%;
  top: calc(var(--plus-top) - (44px - var(--plus)) / 2);
  z-index: 50;
  width: 44px; height: 44px;
  margin: 0 0 0 -22px; padding: 0; border: 0;
  background: none;
  cursor: pointer;
  display: grid; place-items: center;
  -webkit-tap-highlight-color: transparent;
}
#plus {
  position: relative;
  display: block;
  width: var(--plus); height: var(--plus);
  transition: transform .79s var(--flip), opacity .79s var(--flip);
}
#plus::before, #plus::after {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 100%; height: 3px;
  margin-top: -1.5px;
  background: var(--ink);
}
#plus::after { transform: rotate(90deg); }
.menu-open #plus { transform: rotate(135deg); }
.is-intro #plus { transform: rotate(-90deg) scale(.2); opacity: 0; }
.is-reveal #plus { transition-delay: .6s; }
.view-open #toggle { visibility: hidden; }

/* ---------- ぼかし＋生成りの幕 ---------- */
#veil {
  position: fixed; inset: 0;
  z-index: 20;
  pointer-events: none;
  background-color: rgba(245, 243, 240, 0);
  -webkit-backdrop-filter: blur(0px);
  backdrop-filter: blur(0px);
  transition: background-color var(--veil-time) var(--veil-ease) var(--veil-delay),
              -webkit-backdrop-filter var(--veil-time) var(--veil-ease) var(--veil-delay),
              backdrop-filter var(--veil-time) var(--veil-ease) var(--veil-delay);
}
.veil-on #veil {
  background-color: rgba(245, 243, 240, 1);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  pointer-events: auto;
}
.veil-idle #veil { -webkit-backdrop-filter: none; backdrop-filter: none; transition: none; }

/* ---------- メニュー ---------- */
#menu {
  position: fixed; inset: 0;
  z-index: 40;
  display: flex; flex-direction: column;
  padding: calc(var(--plus-top) + var(--plus) + 16px) var(--pad) var(--pad);
  overflow-y: auto;
  overscroll-behavior: contain;
  visibility: hidden;
  text-align: center;
}
.menu-open #menu, .menu-closing #menu { visibility: visible; }
.m-items {
  flex: 1 0 auto;
  min-height: 34vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0; padding: 0 0 2vh;
  list-style: none;
  font-size: var(--big);
  letter-spacing: .02em;
  line-height: 1;
}
.m-items li { margin: 0; padding: .04em 0; }
.m-bio {
  flex: 0 0 auto;
  margin: 0 auto;
  padding: 0 0 5vh;
  max-width: 1360px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.25;
}
.m-bio p { margin: 0; }
.m-bio p + p { margin-top: .6em; }
.m-foot {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px;
  font-size: var(--mid);
  letter-spacing: .02em;
  line-height: 1.2;
}
.m-foot a { display: inline-block; min-height: 32px; }
.m-mail { text-transform: none; }
.m-sns { display: flex; gap: .6em; }
.m-sns a { min-width: 32px; text-align: right; }
.m-copy {
  position: absolute;
  left: 50%; bottom: var(--pad);
  transform: translateX(-50%);
  margin: 0;
  white-space: nowrap;
  font-size: 11px;
}
@media (max-width: 768px) {
  .m-copy { position: static; transform: none; margin-top: 14px; }
}
.ln { display: block; }
.ln-i {
  display: block;
  transform: perspective(800px) translateY(50%) rotateX(-40deg);
  filter: blur(12px);
  opacity: 0;
  transition: none;
}
.menu-open .ln-i {
  transform: none; filter: blur(0px); opacity: 1;
  transition: transform .79s var(--flip) var(--d, 0s), filter .79s var(--flip) var(--d, 0s), opacity .79s var(--flip) var(--d, 0s);
}
.menu-closing .ln-i {
  transform: perspective(800px) translateY(-50%) rotateX(40deg);
  filter: blur(12px); opacity: 0;
  transition: transform .79s var(--flip) var(--d, 0s), filter .79s var(--flip) var(--d, 0s), opacity .79s var(--flip) var(--d, 0s);
}
/* 下線：メニューの大きい字 4px（スマホ 3px）、その他のリンク 2px */
#menu a { text-decoration: underline; text-decoration-color: transparent; text-underline-offset: .12em; text-decoration-thickness: 2px; text-decoration-skip-ink: none; }
#menu .m-items a { text-decoration-thickness: 4px; }
@media (max-width: 768px) { #menu .m-items a { text-decoration-thickness: 3px; } }
#menu a:hover, #menu a:focus-visible, #menu a[aria-current] { text-decoration-color: currentColor; }

/* ---------- 1枚だけ見る画面 ---------- */
#view {
  position: fixed; inset: 0;
  z-index: 30;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  visibility: hidden;
  opacity: 0;
  filter: blur(12px);
  transition: opacity .45s var(--veil-ease), filter .45s var(--veil-ease), visibility 0s linear .45s;
}
#view.is-shown {
  visibility: visible; opacity: 1; filter: blur(0px);
  transition: opacity .45s var(--veil-ease), filter .45s var(--veil-ease), visibility 0s;
}
#view-img {
  display: block;
  max-width: calc(100vw - 32px);
  max-height: 70vh;
  width: auto; height: auto;
}
#view-back {
  margin: 10px 0 0; padding: 10px 20px;
  min-width: 44px; min-height: 36px;
  border: 0; background: none; cursor: pointer;
  font-size: 12px;
}
#view-back:hover { text-decoration: underline; text-decoration-thickness: 2px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
