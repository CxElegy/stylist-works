<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デザイン案を選ぶ | Akari Ito</title>
  <meta name="robots" content="noindex">
  <style>
    /* 3案を見比べて選ぶためのページ（公開前の確認用） */
    :root { --bg: #ffffff; --ink: #111111; --muted: #6b6b6b; --line: #dddddd;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.8; }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: auto; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; }
    .lead { margin: 8px 0 32px; color: var(--muted); }
    .plans { list-style: none; margin: 0; padding: 0; display: grid; gap: 40px 24px; }
    @media (min-width: 900px) { .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .plan a { display: block; }
    .plan__shots { display: grid; grid-template-columns: 1400fr 390fr; gap: 8px; align-items: start; border: 1px solid var(--line); padding: 8px; }
    .plan__id { margin: 16px 0 0; font-size: 32px; font-weight: 700; line-height: 1; }
    .plan__name { margin: 8px 0 0; font-size: 16px; font-weight: 700; }
    .plan__desc { margin: 4px 0 0; color: var(--muted); }
    .plan__go { display: inline-block; margin-top: 12px; border-bottom: 1px solid currentColor; }
    .plan a:hover .plan__go, .plan a:focus-visible .plan__go { opacity: .5; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>デザイン案を選んでください</h1>
    <p class="lead">作品・プロフィールの中身は3案とも同じです。画像を押すと実際のページが開きます（左がパソコン、右がスマホの見え方）。</p>
    <ul class="plans">
      <li class="plan"><a href="a-bold.html">
        <div class="plan__shots"><img src="images/preview/a-1400.jpg" width="1400" height="900" alt="1A パソコンでの見え方"><img src="images/preview/a-390.jpg" width="390" height="780" alt="1A スマホでの見え方"></div>
        <p class="plan__id">1A</p><p class="plan__name">大胆</p>
        <p class="plan__desc">黒地に大きな名前。作品は2列で大きく、番号つき。印象に残したい人向け。</p>
        <span class="plan__go">1A を開く →</span></a></li>
      <li class="plan"><a href="b-cool.html">
        <div class="plan__shots"><img src="images/preview/b-1400.jpg" width="1400" height="900" alt="1B パソコンでの見え方"><img src="images/preview/b-390.jpg" width="390" height="780" alt="1B スマホでの見え方"></div>
        <p class="plan__id">1B</p><p class="plan__name">シンプルにかっこいい</p>
        <p class="plan__desc">白地・太字の名前・左に縦のメニュー。作品を3列で一度にたくさん見せる。</p>
        <span class="plan__go">1B を開く →</span></a></li>
      <li class="plan"><a href="c-simple.html">
        <div class="plan__shots"><img src="images/preview/c-1400.jpg" width="1400" height="900" alt="1C パソコンでの見え方"><img src="images/preview/c-390.jpg" width="390" height="780" alt="1C スマホでの見え方"></div>
        <p class="plan__id">1C</p><p class="plan__name">いちばんシンプル</p>
        <p class="plan__desc">白地に写真を1列で並べるだけ。1枚ずつゆっくり見せる。</p>
        <span class="plan__go">1C を開く →</span></a></li>
    </ul>
  </main>
</body>
</html>
