<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== 3A：名前を真ん中に、写真を大小つけて散らす =====
       参考：審美図鑑「Gregor Collienne」。白地＋黒の太い大文字。色は相談ボタンだけ。
       写真は切らない・重ねない。1列の中で大きさと上下の位置を変えて「散らした」印象を作る */
    :root {
      --bg: #ffffff; --ink: #0b0b0b; --accent: #D9541E;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --pad: 14px; --gap: 14px;
      --lb-bg: #ffffff; --lb-fg: #0b0b0b; --lb-font: var(--sans);
    }
    @media (min-width: 900px) { :root { --pad: 40px; --gap: 28px; } }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.8; text-wrap: pretty; line-break: strict; text-align: center; }
    a { color: inherit; text-decoration: none; }
    p, h1, h2 { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 var(--pad); }
    #sets:empty { min-height: 100svh; }

    .top { padding: 28px var(--pad) 8px; }
    .name { font-size: clamp(40px, 9vw, 120px); font-weight: 800; letter-spacing: .01em; line-height: 1; text-transform: uppercase; }
    .role { font-size: 15px; font-weight: 700; letter-spacing: .3em; margin-top: 14px; }
    .lead { max-width: 30em; margin: 10px auto 0; font-size: 14px; }
    .cta { display: inline-block; margin-top: 16px; background: var(--accent); color: var(--ink); font-weight: 700; padding: 10px 22px; border-radius: 999px; }
    .cta:hover, .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .set { margin-top: 64px; }
    .set--lead { margin-top: 24px; }
    .set__title { font-size: clamp(22px, 3.2vw, 44px); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
    .set__sub { font-size: 14px; margin: 4px 0 20px; }

    .row { display: flex; gap: var(--gap); }
    .row + .row { margin-top: var(--gap); }
    .ph { min-width: 0; }
    .ph__btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
    .ph__btn:hover img, .ph__btn:focus-visible img { opacity: .85; }
    .ph__btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .ph__cap { font-size: 13px; line-height: 1.5; margin-top: 6px; }

    .about { max-width: 40em; margin: 0 auto; }
    .about__bio p + p { margin-top: .6em; }
    .about__meta { margin-top: 16px; }
    .about__meta b { display: block; margin-top: 10px; }
    .contact { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 24px; }
    .contact .cta { margin-top: 0; }
    .contact a:not(.cta) { border-bottom: 1px solid currentColor; }
    .foot { margin-top: 64px; padding-bottom: 24px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top" id="top">
    <h1 class="name" data-p="nameEn">Akari Ito</h1>
    <p class="role"><span data-p="nameJa">伊藤 あかり</span>　スタイリスト</p>
    <p class="lead" data-p="lead">ビューティーからファッション、キッズまで。雑誌・広告・カタログのスタイリングを手がけています。</p>
    <a class="cta" href="#contact">仕事を相談する</a>
  </header>

  <main class="wrap" id="sets"></main>

  <div class="wrap">
    <section class="set" id="profile">
      <h2 class="set__title">Profile</h2>
      <p class="set__sub">プロフィール</p>
      <div class="about">
        <div class="about__bio" data-p="bio"></div>
        <p class="about__meta"><b>得意分野</b><span data-p="specialty"></span></p>
      </div>
    </section>
    <section class="set" id="contact">
      <h2 class="set__title">Contact</h2>
      <p class="set__sub">お仕事のご依頼・ご相談はこちらから</p>
      <div class="contact">
        <a class="cta" data-mail href="#">メールで相談する</a>
        <a data-p="email" href="#"></a>
        <a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>
    <footer class="foot">© <span data-year></span> Akari Ito</footer>
  </div>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/selection.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    (function () {
      var E = Portfolio.el, P = window.PROFILE, data = Portfolio.sets(), main = document.getElementById("sets");
      // 大きさ（1 が基準）と上下の位置を順番に変える。まとまりごとに始まりをずらして、同じ形の列が続かないようにする
      var SCALE = [1, 0.62, 0.84, 0.7, 0.94, 0.58], ALIGN = ["flex-start", "flex-end", "center", "flex-start", "flex-end", "center"];
      data.sets.forEach(function (s, si) {
        var sec = E("section", "set" + (s.lead ? " set--lead" : "")); sec.id = s.id;
        if (s.lead) sec.setAttribute("aria-label", s.title);
        else { sec.appendChild(E("h2", "set__title", s.en)); sec.appendChild(E("p", "set__sub", s.title + (s.note ? "　" + s.note : ""))); }
        var mixed = {}; s.works.forEach(function (w) { mixed[w.media || ""] = 1; });
        var showCap = Object.keys(mixed).length > 1;
        s.nodes.forEach(function (d, i) {
          var k = (i + si * 2) % SCALE.length;
          d.style.flex = (d._r * SCALE[k]).toFixed(4) + " 1 0"; d.style.alignSelf = ALIGN[k];
          if (showCap && d._w.media) d.appendChild(E("p", "ph__cap", d._w.media));
        });
        s.body = sec.appendChild(E("div", ""));
        main.appendChild(sec);
      });
      var mq = window.matchMedia("(min-width: 900px)");
      function chunks(n, wide) { if (wide) return n > 5 ? [3, n - 3] : [n]; var out = []; while (n > 3) { out.push(2); n -= 2; } out.push(n); return out; }
      function layout() {
        data.sets.forEach(function (s) {
          s.body.innerHTML = ""; var k = 0;
          chunks(s.nodes.length, mq.matches).forEach(function (n) { var row = s.body.appendChild(E("div", "row")); for (var j = 0; j < n; j++) row.appendChild(s.nodes[k++]); });
        });
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout); else mq.addListener(layout);
      var mail = document.querySelector("[data-mail]");
      if (P.email) mail.href = "mailto:" + P.email; else mail.remove();
    })();
  </script>
</body>
</html>
