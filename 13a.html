<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊藤 あかり｜スタイリスト</title>
<meta name="description" content="スタイリスト 伊藤 あかり の作品集。ビューティーからファッション、キッズまで、雑誌・広告・カタログのスタイリング。">
<style>
@font-face{font-family:"Bodoni Moda";src:url("assets/fonts/bodoni-moda-400-latin.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url("assets/fonts/bodoni-moda-700-latin.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url("assets/fonts/bodoni-moda-400-italic-latin.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("assets/fonts/instrument-sans-latin.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}

:root{
  --ink:#151515;
  --didone:"Bodoni Moda","Didot","Bodoni 72",serif;
  --sans:"Instrument Sans","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
  --edge:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#111}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
a,button{color:inherit;font:inherit;text-decoration:none}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0}
img,canvas{display:block;border:0}
:focus{outline:none}
:focus-visible{outline:1px solid currentColor;outline-offset:3px}
[hidden]{display:none !important}

/* ================= the poster: two halves joined with no gap ================= */
#poster{display:flex;position:relative;transition:opacity .15s linear}
#poster.out{opacity:0}
.half{position:relative;overflow:hidden;flex:none;background:var(--bg,#ddd)}
.half .hit{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:pointer}
.half canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.half .hit:focus-visible{outline:none}
.half .hit:focus-visible::after{content:"";position:absolute;inset:6px;outline:1px solid #fff;box-shadow:0 0 0 1px #000}

/* text on the fragmented half. --u = 1% of the half's width (set by the script) */
.frag{--u:7.2px}
.tx{position:absolute;z-index:2;pointer-events:none;color:#fff;border-radius:2px}
.tx a,.tx button,button.tx{pointer-events:auto}
#tblock{top:calc(var(--u) * 6);max-width:70%}
#tblock.at-l{left:calc(var(--u) * 6);text-align:left}
#tblock.at-r{right:calc(var(--u) * 6);text-align:left}
#ttl{margin:0;font-family:var(--didone);font-weight:400;font-size:calc(var(--u) * 11.6);line-height:.84;letter-spacing:-.012em;text-transform:uppercase;white-space:nowrap}
#ttl span{display:block}
#sub{margin:calc(var(--u) * 3) 0 0;font-size:clamp(11px,calc(var(--u) * 1.5),14px);line-height:1.75;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
#sub span{display:block}
#sub .ja{letter-spacing:.14em;text-transform:none}
@media (max-width:420px){ #sub .ja{letter-spacing:.06em} }
#rule{display:block;width:22px;height:0;border-top:1px solid currentColor;margin:calc(var(--u) * 2) 0 0}
#sig{display:inline-block;margin:6px 0 0;padding:12px 0;font-size:12px;line-height:16px;letter-spacing:.14em}
#sig span{border-bottom:1px solid currentColor;padding-bottom:1px}

.mi{font-size:11px;line-height:16px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
#menuBtn{top:calc(var(--u) * 6 - 12px);min-height:40px;min-width:40px;padding:12px 0}
#menuBtn.at-l{left:calc(var(--u) * 6)}
#menuBtn.at-r{right:calc(var(--u) * 6)}
#menuBtn span{display:inline-block;border-bottom:1px solid currentColor;padding-bottom:1px}
#idx{left:calc(var(--u) * 6 - 12px);bottom:calc(var(--u) * 4 - 12px);display:flex;align-items:center}
#idx button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#idx button::before{content:"";width:8px;height:8px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateX(2px) rotate(45deg)}
#idx button.nx::before{transform:translateX(-2px) rotate(-135deg)}
#idx output{padding:0 4px}
#count{right:calc(var(--u) * 6);bottom:calc(var(--u) * 4);margin:0}
@media (max-width:400px){ #count{bottom:calc(var(--u) * 4 + 34px)} }
/* or under MENU, when the photo is quieter there (chosen by the script) */
#count.up{bottom:auto;top:calc(var(--u) * 6 + 30px)}
#count.up.at-l{right:auto;left:calc(var(--u) * 6)}

/* wide: side by side, one screen */
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  #poster{flex-direction:row;height:100vh}
  .half{width:50%;height:100%}
}
@supports (height:100svh){ @media (min-width:900px){ #poster{height:100svh} } }
/* narrow: stacked like the reference, the page scrolls */
@media (max-width:899px){
  #poster{flex-direction:column;touch-action:pan-y pinch-zoom}
  .half{width:100%;height:min(133.333vw,max(64vh,420px))}
  .frag{--u:3.9px}
  #ttl{font-size:calc(var(--u) * 12.4)}
}
@supports (height:100svh){ @media (max-width:899px){ .half{height:min(133.333vw,max(64svh,420px))} } }

/* ================= menu ================= */
#menu{position:fixed;inset:0;z-index:40;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;transition:opacity .2s linear}
#menu.on{opacity:1}
#menu .in{max-width:760px;margin:0 auto;padding:max(12vh,80px) var(--edge) 10vh}
#menu .k{margin:0 0 4vh;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
#menu ol{list-style:none;margin:0;padding:0}
#menu li button{display:flex;align-items:baseline;gap:18px;width:100%;padding:6px 0;text-align:left}
#menu li .en{font-family:var(--didone);font-size:clamp(40px,7vw,76px);line-height:1;text-transform:uppercase;letter-spacing:-.01em}
#menu li .ja{font-size:12px;letter-spacing:.14em;white-space:nowrap}
#menu li button:hover .en{font-style:italic}
#menu .c{margin:6vh 0 0;font-size:14px}
#menu .c a{display:inline-block;padding:10px 0}
#menu .c a span{border-bottom:1px solid var(--ink)}
.xb{position:fixed;right:var(--edge);top:var(--edge);width:40px;height:40px;z-index:2;background:rgba(255,255,255,.92);border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.92)}
.xb::before,.xb::after{content:"";position:absolute;left:50%;top:50%;width:70%;height:1px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg)}
.xb::after{transform:translate(-50%,-50%) rotate(-45deg)}

/* ================= category view (from r4-snog) ================= */
#detail{position:fixed;left:0;top:0;width:100%;height:100%;z-index:30;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;opacity:0;transition:opacity .35s linear}
#detail.shown{opacity:1}
#detail .in{max-width:1180px;margin:0 auto;padding:max(10vh,90px) var(--edge) 16vh}
#detail h2{margin:0 0 6vh;text-align:center;font-family:var(--didone);font-weight:400;font-size:clamp(26px,3vw,42px);line-height:1;letter-spacing:.02em;white-space:nowrap;color:var(--ink)}
#detail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3.4vw,52px);align-items:start;grid-auto-flow:dense}
#detail ol li.wide{grid-column:span 2}
#detail ol li{opacity:0;transform:translateY(18px);transition:opacity .5s ease-out,transform .5s ease-out;transition-delay:calc(var(--n,0) * 35ms + 300ms)}
#detail.shown ol li{opacity:1;transform:none}
#detail h2,#detail .more{opacity:0;transition:opacity .4s linear .3s}
#detail.shown h2,#detail.shown .more{opacity:1}
#detail:focus-visible{outline:none}
#detail ol li button{display:block;width:100%;cursor:zoom-in}
#detail ol li img{width:100%;height:auto;transition:opacity .2s linear}
#detail ol li button:hover img{opacity:.8}
#detail .more{margin:14vh 0 0;text-align:center}
#detail .more .k{margin:0 0 20px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
#detail .more ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 clamp(22px,3.2vw,52px)}
#detail .more li button{font-family:var(--didone);font-size:clamp(34px,5vw,68px);line-height:1.2;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
#detail .more li button:hover,#detail .more li button:focus-visible{font-style:italic}
#detail .more .c{margin:9vh 0 0;font-size:14px;line-height:1.6}
#detail .more .c a{display:inline-block;padding:10px 0}
#detail .more .c a span{border-bottom:1px solid var(--ink)}
#closeDetail{z-index:35}

/* ================= lightbox (from r4-snog) ================= */
#lb{position:fixed;left:0;top:0;width:100%;height:100%;z-index:45;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s linear;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
#lb.on{opacity:1}
#lb figure{flex:none;margin:auto;transition:transform .17s ease-out,opacity .17s linear;will-change:transform}
#lb img{max-width:calc(100vw - 2 * max(64px,9vw) - 20px);max-height:min(86vh,calc(100vh - 96px));width:auto;height:auto;object-fit:contain}
#lb .nv{position:fixed;top:0;bottom:0;width:max(64px,9vw);z-index:1;display:flex;align-items:center;justify-content:center}
#lb .pv{left:0}
#lb .nx{right:0}
#lb .nv::before{content:"";width:16px;height:16px;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateX(4px) rotate(45deg)}
#lb .nx::before{transform:translateX(-4px) rotate(-135deg)}
#lb.one .nv{display:none}
#lb .ct{position:fixed;left:0;right:0;bottom:var(--edge);margin:0;text-align:center;pointer-events:none;font-size:12px;letter-spacing:.2em}
.fine #lb img.can{cursor:zoom-in}
#lb.zoom{overflow:auto;align-items:flex-start}
#lb.zoom figure{padding:56px 0 64px}
#lb.zoom img{max-width:none;max-height:none;cursor:zoom-out}
#lb.zoom .nv,#lb.zoom .ct{display:none}
#lb .nv:focus-visible{outline:none}
#lb .nv:focus-visible::before{outline:1px solid var(--ink);outline-offset:12px}
body.locked{overflow:hidden}

@media (max-width:767px){
  :root{--edge:10px}
  #detail .in{padding:76px 10px 16vh}
  #detail h2{font-size:26px;margin-bottom:28px}
  #detail ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #lb img{max-width:calc(100vw - 20px);max-height:min(74vh,calc(100vh - 124px))}
  #lb .nv{top:auto;bottom:4px;height:52px;width:72px}
  #lb .ct{bottom:23px}
  #menu .in{padding-top:80px}
}
@media (prefers-reduced-motion:reduce){
  #poster,#menu,#detail,#detail li,#detail li img,#lb,#lb figure,#detail h2,#detail .more{transition:none !important}
}
</style>
</head>
<body>

<main id="poster" aria-label="作品のポスター">
  <section class="half orig" aria-label="元の写真">
    <a class="hit" id="hitO" href="#selected"><canvas id="cvO" role="img"></canvas></a>
  </section>
  <section class="half frag" id="frag" aria-label="切り片で組み直した写真">
    <a class="hit" id="hitF" href="#selected" tabindex="-1" aria-hidden="true"><canvas id="cvF"></canvas></a>
    <div class="tx at-l" id="tblock">
      <h1 id="ttl"></h1>
      <p id="sub"><span class="en" id="subEn"></span><span class="ja" id="subJa"></span></p>
      <i id="rule" aria-hidden="true"></i>
      <a id="sig" href="#"><span>お問い合わせ</span></a>
    </div>
    <button class="tx mi at-r" id="menuBtn" type="button" aria-haspopup="dialog"><span>Menu</span></button>
    <div class="tx mi" id="idx">
      <button class="pv" type="button" aria-label="前のポスター"></button>
      <output id="idxT" aria-live="polite"></output>
      <button class="nx" type="button" aria-label="次のポスター"></button>
    </div>
    <p class="tx mi" id="count"></p>
  </section>
</main>

<div id="menu" role="dialog" aria-modal="true" aria-label="作品のジャンル" hidden>
  <button class="xb" id="closeMenu" type="button" aria-label="閉じる"></button>
  <div class="in"><p class="k">Works</p><ol></ol><p class="c"></p></div>
</div>

<section id="detail" aria-label="作品の一覧" hidden tabindex="-1"><div class="in"><h2></h2><ol></ol><nav class="more" aria-label="ほかの作品と、お問い合わせ"></nav></div></section>
<button class="xb" id="closeDetail" type="button" aria-label="閉じる" hidden></button>

<div id="lb" role="dialog" aria-modal="true" aria-label="写真の拡大表示" hidden>
  <figure><img alt="" draggable="false"></figure>
  <button class="nv pv" type="button" aria-label="前の写真"></button>
  <button class="nv nx" type="button" aria-label="次の写真"></button>
  <button class="xb" type="button" aria-label="閉じて一覧に戻る"></button>
  <p class="ct" aria-live="polite"></p>
</div>

<script src="data/works.js"></script>
<script src="data/sizes.js"></script>
<script src="data/thumbs.js"></script>
<script src="data/selection.js"></script>
<script src="data/profile.js"></script>
<script>
(function(){
  'use strict';
  var SEL = window.SELECTION || {lead:[],groups:[]};
  var SIZES = window.SIZES || {};
  var PRO = window.PROFILE || {};
  var THUMBS = window.THUMBS || {};
  var doc = document, body = doc.body, root = doc.documentElement;
  function $(id){ return doc.getElementById(id); }
  function el(tag, cls, txt){ var e = doc.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function inFp(t){ return !!(t && t.closest && t.closest('.fp')); }       /* the shared font picker: never ours to handle */

  /* ---------- groups ---------- */
  var GROUPS = {};
  GROUPS.selected = { id:'selected', title:'セレクト', en:'Selected', items:(SEL.lead || []).slice() };
  (SEL.groups || []).forEach(function(g){ GROUPS[g.id] = g; });
  function galleryOf(g){ return (g.gallery && g.gallery.length ? g.gallery : (g.items || [])).slice(); }

  /* ---------- the posters: SELECTION.lead and the genres' first items, ones with room around the person ---------- */
  var POSTERS = [
    { g:'selected',  src:'images/works/personal-01.jpg' },
    { g:'casual',    src:'images/tumblr/01-uniqlo-01.jpg' },
    { g:'selected',  src:'images/works/personal-04.jpg' },
    { g:'elegance',  src:'images/tumblr/07-global-work-01.jpg' },
    { g:'kids',      src:'images/tumblr/06-kids-04.jpg' },
    { g:'selected',  src:'images/tumblr/08-test-shoot-02.jpg' }
  ].filter(function(p){ return GROUPS[p.g] && SIZES[p.src]; });

  /* ---------- environment ---------- */
  var mqWide = matchMedia('(min-width:900px)'), mqNarrow = matchMedia('(max-width:767px)');
  var mqCalm = matchMedia('(prefers-reduced-motion:reduce)'), mqFine = matchMedia('(hover:hover) and (pointer:fine)');
  function narrow(){ return mqNarrow.matches; }
  function calm(){ return mqCalm.matches; }
  function fine(){ return mqFine.matches; }
  root.classList.toggle('fine', fine());
  var raf = requestAnimationFrame.bind(window);
  function now(){ return performance.now(); }
  function outCubic(k){ var u = 1 - k; return 1 - u * u * u; }
  function two(n){ return (n < 10 ? '0' : '') + n; }

  /* ---------- fixed text ---------- */
  var nameEn = PRO.nameEn || 'Akari Ito', nameJa = PRO.nameJa || '伊藤 あかり';
  var ttl = $('ttl');
  nameEn.split(/\s+/).forEach(function(w){ ttl.appendChild(el('span', null, w)); });
  ttl.setAttribute('aria-label', nameEn);
  $('subJa').textContent = nameJa + '｜スタイリスト';
  var MAIL = PRO.email ? 'mailto:' + PRO.email : '';
  if (MAIL) $('sig').href = MAIL; else $('sig').hidden = true;

  /* ---------- images ---------- */
  var imgCache = {};
  function loadImg(src){
    if (!imgCache[src]) imgCache[src] = new Promise(function(res, rej){
      var im = new Image(); im.decoding = 'async';
      im.onload = function(){ (im.decode ? im.decode().catch(function(){}) : Promise.resolve()).then(function(){ res(im); }); };
      im.onerror = rej; im.src = src;
    });
    return imgCache[src];
  }

  /* ---------- reading a photo: edge colours and where the person is ---------- */
  var anaCache = {};
  function lum(r, g, b){
    function c(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * c(r) + 0.7152 * c(g) + 0.0722 * c(b);
  }
  function analyse(src, img){
    if (anaCache[src]) return anaCache[src];
    var iw = img.naturalWidth, ih = img.naturalHeight, GW = 40, GH = Math.max(20, Math.round(GW * ih / iw));
    var cv = doc.createElement('canvas'); cv.width = GW; cv.height = GH;
    var cx = cv.getContext('2d', { willReadFrequently:true }); cx.drawImage(img, 0, 0, GW, GH);
    var d = cx.getImageData(0, 0, GW, GH).data;
    function px(x, y){ var i = (y * GW + x) * 4; return [d[i], d[i + 1], d[i + 2]]; }
    var dist = [], all = [], mean = [0, 0, 0], n = 0, lumSum = 0;
    for (var y = 0; y < GH; y++){
      var L = px(0, y), L2 = px(1, y), R = px(GW - 1, y), R2 = px(GW - 2, y);
      for (var x = 0; x < GW; x++){
        var t = x / (GW - 1), p = px(x, y), s = 0;
        for (var c = 0; c < 3; c++){ var bg = ((L[c] + L2[c]) / 2) * (1 - t) + ((R[c] + R2[c]) / 2) * t; s += (p[c] - bg) * (p[c] - bg); }
        s = Math.sqrt(s); dist.push(s); all.push(s);
        lumSum += lum(p[0], p[1], p[2]);
      }
      [L, R].forEach(function(q){ mean[0] += q[0]; mean[1] += q[1]; mean[2] += q[2]; n++; });
    }
    all.sort(function(a, b){ return a - b; });
    var thr = Math.max(30, all[Math.floor(all.length * 0.5)] * 0.9);
    var mask = dist.map(function(v){ return v > thr ? 1 : 0; });
    /* the person's box: weighted percentiles of the masked cells, kept towards the middle */
    var xs = [], ys = [];
    for (var j = 0; j < mask.length; j++) if (mask[j]){
      var mx = j % GW, my = Math.floor(j / GW), cw = 1 - Math.min(0.9, Math.abs(mx / (GW - 1) - 0.5) * 1.4);
      if (cw > 0.15){ xs.push(mx / (GW - 1)); ys.push(my / (GH - 1)); }
    }
    xs.sort(function(a, b){ return a - b; }); ys.sort(function(a, b){ return a - b; });
    function pc(a, q, dflt){ return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * q))] : dflt; }
    var box = { x0:Math.max(0.12, pc(xs, 0.06, 0.3)), x1:Math.min(0.88, pc(xs, 0.94, 0.7)), y0:Math.max(0.03, pc(ys, 0.04, 0.1)), y1:Math.min(0.98, pc(ys, 0.97, 0.95)) };
    if (box.x1 - box.x0 < 0.25){ var mc = (box.x0 + box.x1) / 2; box.x0 = mc - 0.125; box.x1 = mc + 0.125; }
    var a = { GW:GW, GH:GH, mask:mask, box:box,
      edge:'rgb(' + Math.round(mean[0] / n) + ',' + Math.round(mean[1] / n) + ',' + Math.round(mean[2] / n) + ')',
      dark:lumSum / (GW * GH) < 0.3 };
    anaCache[src] = a;
    return a;
  }

  /* ---------- the slices: made once per poster from a seeded random, in the photo's own 0–1 units ---------- */
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  var sliceCache = {};
  function slicesFor(src, ana){
    if (sliceCache[src]) return sliceCache[src];
    var R = rng(hash(src)), b = ana.box, bw = b.x1 - b.x0, bh = b.y1 - b.y0, bcx = (b.x0 + b.x1) / 2;
    function rr(a, c){ return a + (c - a) * R(); }
    /* candidate cells: the person's cells inside the box, outline cells counted three times */
    var GW = ana.GW, GH = ana.GH, m = ana.mask, cand = [];
    for (var y = 0; y < GH; y++) for (var x = 0; x < GW; x++){
      var u = (x + 0.5) / GW, v = (y + 0.5) / GH;
      if (u < b.x0 || u > b.x1 || v < b.y0 || v > b.y1) continue;
      if (!m[y * GW + x]) continue;
      var edge = (x && !m[y * GW + x - 1]) || (x < GW - 1 && !m[y * GW + x + 1]) || (y && !m[(y - 1) * GW + x]) || (y < GH - 1 && !m[(y + 1) * GW + x]);
      var w = edge ? 3 : 1; for (var k = 0; k < w; k++) cand.push([u, v]);
    }
    if (cand.length < 20) for (var q = 0; q < 200; q++) cand.push([rr(b.x0, b.x1), rr(b.y0, b.y1)]);
    var out = [], frames = [], N = 22;
