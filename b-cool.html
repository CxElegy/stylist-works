<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akari Ito | Stylist</title>
  <meta name="description" content="スタイリスト 伊藤あかり のポートフォリオ">
  <link rel="stylesheet" href="assets/css/lightbox.css">
  <style>
    /* ===== B案：シンプルにかっこいい（参照ページ系） ===== */
    :root {
      --bg: #ffffff; --ink: #000000; --muted: #8c8c8c;
      --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      --side: 120px; --gap: 40px;
      --lb-bg: #ffffff; --lb-fg: #000000; --lb-font: var(--sans);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 2; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; height: auto; }

    /* 左の縦書きメニュー */
    .side {
      position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 10;
      display: flex; flex-direction: column; align-items: center; padding: 56px 0 48px;
    }
    .side a, .side p { writing-mode: vertical-rl; margin: 0; }
    .side__nav { display: flex; flex-direction: column; align-items: center; gap: 44px; margin-top: 8px; font-size: 20px; }
    .side__nav a:hover { opacity: .5; }
    .side__copy { margin-top: auto !important; font-size: 13px; }

    main { margin-left: var(--side); padding: 48px 80px 120px 30px; max-width: 1360px; }
    .name { margin: 0; font-size: clamp(44px, 5.4vw, 64px); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
    .role { margin: 6px 0 0; font-size: 14px; }

    .tabs { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 40px 0 0 4px; }
    .tabs button { background: none; border: 0; padding: 0 0 4px; font: inherit; cursor: pointer; color: inherit; border-bottom: 1px solid transparent; }
    .tabs button[aria-pressed="true"] { border-color: currentColor; }

    .profile { margin: 40px 0 0 4px; max-width: 640px; display: none; }
    .profile.is-open { display: block; }
    .profile p { margin: 0; }
    .profile__ja { margin-bottom: 12px !important; }
    .profile dl { margin: 24px 0 0; }
    .profile dt { color: var(--muted); font-size: 13px; margin-top: 12px; }
    .profile dd { margin: 0; }

    /* 3列の写真グリッド（高さは写真に合わせる） */
    /* 作品が並ぶ前に下の文章が先に見えて、あとで押し下げられるのを防ぐ */
    .grid:empty { min-height: 100svh; }
    .grid { columns: 3; column-gap: var(--gap); margin-top: 88px; }
    .work { break-inside: avoid; margin-bottom: var(--gap); opacity: 0; transition: opacity .8s; }
    .work.is-in { opacity: 1; }
    .work__btn { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #f2f2f2; cursor: pointer; }
    .work__btn img { width: 100%; }
    .work__over {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.42); color: #fff; font-size: 15px; opacity: 0; transition: opacity .35s;
    }
    .work__btn:hover .work__over, .work__btn:focus-visible .work__over { opacity: 1; }
    .work__cap { display: none; }

    .contact { margin-top: 120px; }
    .contact h2 { margin: 0 0 16px; font-size: 14px; font-weight: 400; color: var(--muted); }
    .contact a { border-bottom: 1px solid currentColor; }
    .contact li { margin: 4px 0; }

    /* スマホ：参照ページと同じく1列。写真の下に小さく媒体名 */
    @media (max-width: 899px) {
      .side { display: none; }
      main { margin-left: 0; padding: 32px 0 80px; }
      .head, .contact { padding: 0 20px; }
      .grid { columns: 1; margin-top: 64px; }
      .work { margin-bottom: 48px; }
      .work__over { display: none; }
      .work__cap { display: block; text-align: center; margin: 16px 0 0; font-size: 13px; }
    }
    @media (min-width: 900px) and (max-width: 1100px) { .grid { columns: 2; } }
    @media (prefers-reduced-motion: reduce) { .work { opacity: 1; transition: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <aside class="side">
    <nav class="side__nav" aria-label="メニュー">
      <a href="#works">works</a>
      <a href="#profile" data-open-profile>profile</a>
      <a href="#contact">contact</a>
    </nav>
    <p class="side__copy">© <span data-year></span> Akari Ito</p>
  </aside>

  <main id="top">
    <div class="head">
      <h1 class="name" data-p="nameEn">Akari Ito</h1>
      <p class="role" data-p="role">Stylist</p>

      <div class="tabs" role="group" aria-label="表示切り替え">
        <button type="button" data-tab="all" aria-pressed="true">all</button>
        <button type="button" data-tab="profile" aria-pressed="false">profile</button>
      </div>

      <section class="profile" id="profile" aria-label="プロフィール">
        <p class="profile__ja" data-p="nameJa">伊藤 あかり</p>
        <div data-p="bio"></div>
        <dl>
          <dt>Specialty</dt><dd data-p="specialty"></dd>
          <dt>Clients</dt><dd data-p="clients"></dd>
        </dl>
      </section>
    </div>

    <ul class="grid" id="works" aria-label="作品一覧"></ul>

    <section class="contact" id="contact">
      <h2>contact</h2>
      <ul>
        <li><a data-p="email" href="#"></a></li>
        <li><a data-p="instagram" href="#" target="_blank" rel="noopener">Instagram</a></li>
        <li><a data-p="tumblr" href="#" target="_blank" rel="noopener">Tumblr</a></li>
      </ul>
    </section>
  </main>

  <script src="data/works.js"></script>
  <script src="data/sizes.js"></script>
  <script src="data/profile.js"></script>
  <script src="assets/js/portfolio.js"></script>
  <script>
    var E = Portfolio.el;
    Portfolio.init({
      grid: "#works",
      render: function (w) {
        var li = E("li", "work");
        var b = E("button", "work__btn js-open"); b.type = "button";
        b.setAttribute("aria-label", Portfolio.label(w) + " を拡大表示");
        b.appendChild(E("img"));
        if (w.media) b.appendChild(E("span", "work__over", w.media));
        li.appendChild(b);
        if (w.media) li.appendChild(E("p", "work__cap", w.media));
        return li;
      }
    });
    // all / profile の切り替え
    var prof = document.getElementById("profile");
    function setTab(t) {
      prof.classList.toggle("is-open", t === "profile");
      document.querySelectorAll("[data-tab]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.tab === t); });
    }
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.tab); }); });
    document.querySelector("[data-open-profile]").addEventListener("click", function () { setTab("profile"); });
  </script>
</body>
</html>
